---
# .github/workflows/copilot-setup-steps.yml
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions: {}

jobs:
  copilot-setup-steps:
    name: copilot-setup-steps
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Make apt cache writable
        run: sudo chmod -R a+rwX /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/copilot-setup-steps.yml') }}
          restore-keys: ${{ runner.os }}-apt-

      - name: Install apt tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang-format clang-tidy cmake shellcheck \
            gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Cache pip packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/copilot-setup-steps.yml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install pip tools
        run: pip3 install cmakelang yamllint check-jsonschema

      - name: Cache npm packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('.github/workflows/copilot-setup-steps.yml') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm tools
        run: npm install -g markdownlint-cli2 prettier
