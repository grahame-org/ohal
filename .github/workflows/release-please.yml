---
# .github/workflows/release-please.yml
name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    # All GitHub API operations (creating/updating PRs, tags, and releases) are
    # performed using the app token generated below; no GITHUB_TOKEN write access
    # is required.  The app token triggers normal pull_request events so all
    # quality-gate workflows run on the release PR automatically.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Pin GitHub Actions to a full commit SHA; update this SHA intentionally when upgrading.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          command: manifest
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
