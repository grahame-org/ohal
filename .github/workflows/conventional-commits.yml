---
# .github/workflows/conventional-commits.yml
name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_target:
    # Allows release-please (which uses GITHUB_TOKEN) to trigger this workflow.
    # Only the PR title is read (no PR code is checked out or executed).
    # The job condition below limits execution to bot-created PRs so regular
    # contributor PRs use the pull_request trigger only.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check-title:
    name: check-title
    runs-on: ubuntu-latest
    # For pull_request_target events, only run for bot-created PRs (e.g. release-please).
    # Regular contributor PRs are already handled by the pull_request trigger above.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: read # required to check out the commitlint config
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validate PR title
        run: echo "$PR_TITLE" | npx --no -- commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
