---
# .github/workflows/build-test-project.yml
name: Build test_project

on:
  pull_request:
  pull_request_target:
    # Allows release-please (which uses GITHUB_TOKEN) to trigger this workflow.
    # Runs against the base branch; the job condition below limits execution to
    # bot-created PRs so regular contributor PRs use the pull_request trigger only.
    types: [opened, synchronize, reopened]
  merge_group:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # For pull_request_target events, only run for bot-created PRs (e.g. release-please).
    # Regular contributor PRs are already handled by the pull_request trigger above.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache apt packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/apt-archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build-test-project.yml') }}
          restore-keys: ${{ runner.os }}-apt-

      - name: Install cross-compiler
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            -o dir::cache::archives="$HOME/apt-archives" \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure
        working-directory: test_project
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi-gcc.cmake
          -G "Unix Makefiles"

      - name: Build
        working-directory: test_project
        run: cmake --build build -j "$(nproc)"

      - name: Archive firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nucleo-u083rc-firmware
          path: |
            test_project/build/nucleo-u083rc.elf
            test_project/build/nucleo-u083rc.hex
            test_project/build/nucleo-u083rc.bin
