---
# .github/workflows/build-test-project.yml
name: Build test_project

on:
  pull_request:
  merge_group:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache apt packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/apt-archives/*.deb
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build-test-project.yml') }}
          restore-keys: ${{ runner.os }}-apt-

      - name: Install cross-compiler
        run: |
          mkdir -p ~/apt-archives
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            -o dir::cache::archives="$HOME/apt-archives" \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure
        working-directory: test_project
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=arm-none-eabi-gcc.cmake
          -G "Unix Makefiles"

      - name: Build
        working-directory: test_project
        run: cmake --build build -j "$(nproc)"

      - name: Archive firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nucleo-u083rc-firmware
          path: |
            test_project/build/nucleo-u083rc.elf
            test_project/build/nucleo-u083rc.hex
            test_project/build/nucleo-u083rc.bin
