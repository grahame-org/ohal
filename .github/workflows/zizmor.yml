---
# .github/workflows/zizmor.yml
name: zizmor

on:
  pull_request:
  pull_request_target:
    # Allows release-please (which uses GITHUB_TOKEN) to trigger this workflow.
    # Runs against the base branch; the job condition below limits execution to
    # bot-created PRs so regular contributor PRs use the pull_request trigger only.
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    # For pull_request_target events, only run for bot-created PRs (e.g. release-please).
    # Regular contributor PRs are already handled by the pull_request trigger above.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'github-actions[bot]'
    permissions:
      contents: read
      security-events: write # required to upload SARIF to Code Scanning
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip3 install zizmor

      - name: Run zizmor (pedantic)
        run: zizmor --pedantic --format sarif . > zizmor-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4.35.4
        if: always()
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor
