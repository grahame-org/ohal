  - gpio-port-8:
      reference:
        sections: [8.2, 8.4]
      note: >-
        Reusable register layout for any 8-bit GPIO port. Each 8-bit port is the
        byte-access view of one byte within its parent 16-bit port. The lower-numbered
        port in each pair sits at the parent port's base address; the higher-numbered
        port sits at parent base + 1. Base addresses vary by device model; no instances
        are defined at the family layer.
