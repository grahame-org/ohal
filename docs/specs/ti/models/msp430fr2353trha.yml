peripheral-availability:
  - peripheral: gpio
    instances: [P1, P2, P3, P4, P5, P6]
    note: >-
      P5 exposes bits 0–1 (2 pins), P6 exposes bits 0–1 (2 pins) on the 40-pin VQFN package.
      P6.2–P6.6 and P5.2–P5.4 are not bonded out. Total 34 GPIO-capable pins.
      Exposed thermal pad (EP, pad 41) must be connected to VSS.
