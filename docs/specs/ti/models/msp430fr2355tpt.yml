    # MSP430 alternate functions are selected by the PxSEL0/PxSEL1 register bits.
    # SEL=01 (SEL0=1, SEL1=0): module function 1
    # SEL=10 (SEL0=0, SEL1=1): module function 2
    # SEL=11 (SEL0=1, SEL1=1): module function 3 / analog
    # SEL=00 (both clear) selects GPIO; not listed in functions below.
    - pin: "P1.2/UCB0SIMO/UCB0SDA/TB0TRG/OA0-/A2/Veref-"
      number: 1
      gpio:
        port: 1
        bit: 2
      functions:
        # DIR = x, SEL0 = 0, SEL1 = 0 selects GPIO function for the pin.
        AF0: GPIO
        # DIR = x, SEL0 = 1, SEL1 = 0 selects the UCB0SIMO/UCB0SDA function for the pin.
        AF1: UCB0SIMO/UCB0SDA
        # DIR = 0, SEL0 = 0, SEL1 = 1 selects the TB0TRG function for the pin.
        AF2: TB0TRG
        # DIR = x, SEL0 = 1, SEL1 = 1 selects the analog function for the pin.
        AF3: OA0-/A2/Veref-
