flash-kb: 32
sram-kb: 4
pin-count: 48
peripheral-availability:
  - peripheral: gpio
    instances: [P1, P2, P3, P4, P5, P6]
    note: >-
      P5 exposes bits 0–4 (5 pins) and P6 exposes bits 0–6 (7 pins) on the 48-pin LQFP package.
      Total 44 GPIO-capable pins.
alternate-functions:
