        # DIR = x, SEL0 = 0, SEL1 = 0 selects GPIO function for the pin.
        AF0: GPIO
        # DIR = x, SEL0 = 1, SEL1 = 0 selects the UCB0SOMI/UCB0SCL function for the pin.
        AF1: UCB0SOMI/UCB0SCL
        # DIR = x, SEL0 = 1, SEL1 = 1 selects the analog function for the pin.
        AF2: OA0+/A3
