        AF1: UCB0CLK
        # DIR = 0, SEL0 = 0, SEL1 = 1 selects the VSS function for the pin.
        AF2: VSS
        # DIR = 1, SEL0 = 0, SEL1 = 1 selects the ACLK function for the pin.
        AF3: ACLK
        # DIR = x, SEL0 = 1, SEL1 = 1 selects the analog function for the pin.
        AF4: OA0O/COMP0.1/A1
