---
spec-version: "1.0.0"
vendor: "Texas Instruments"
reference:
  source: SLASEC4D
  title: "MSP430FR235x, MSP430FR215x Mixed-Signal Microcontrollers"
  revision: "D"
  last-modified: "2019-12"
family-ref: msp430fr2xx4xx
model: msp430fr2355trsm
package: VQFN32
flash-kb: 32
sram-kb: 4
pin-count: 32
peripheral-availability:
  - peripheral: gpio
    instances: [P1, P2, P3, P4]
    note: >-
      P4 exposes bits 0–3 and 6–7 (6 pins) on the 32-pin VQFN package.
      P4.4–P4.5, all P5 pins, all P6 pins, and P2.2–P2.3 are not bonded out.
      UCB1SOMI and UCB1SIMO are not applicable in this package.
      Exposed thermal pad (EP, pad 33) must be connected to VSS.
      Total 28 GPIO-capable pins.
alternate-functions:
  reference:
    sections: [4.1, 4.2, 4.3, 6.11]
    figures: ["4-4"]
    tables: ["4-1", "4-2"]
  pins:
    - pin: "PA1"
      number: 1
      gpio:
        port: A
        bit: 1
      functions:
        "SEL=01": UCB0CLK
        "SEL=10,DIR=0": VSS
        "SEL=10,DIR=1": ACLK
        "SEL=11": OA0O/COMP0.1/A1
    - pin: "PA0"
      number: 2
