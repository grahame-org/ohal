              represented as 0x00 here. The schema does not support unknown
              factory-trimmed reset bytes.
            fields:
              - name: RESERVED
                msb: 31
                lsb: 31
                width: 1
                access: res
                settings: ~
              - name: HSITRIM
                msb: 30
                lsb: 24
                width: 7
                access: rw
                settings: ~
              - name: HSICAL
                msb: 23
                lsb: 16
                width: 8
                access: r
                settings: ~
              - name: MSITRIM
                msb: 15
                lsb: 8
                width: 8
                access: rw
                settings: ~
              - name: MSICAL
