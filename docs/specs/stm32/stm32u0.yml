exti:
  reference:
    section: "12"
    tables: [59]
  note: >-
    Lines 18, 19, 22, 26, 32, 36 are reserved on STM32U031xx devices.
    Lines 0-15 are GPIO configurable events; source port selected via EXTI_EXTICRx.
    Configurable lines have pending bits in EXTI_RPR1/EXTI_FPR1 (cleared by writing 1).
    Direct lines have no EXTI pending bit; cleared in the peripheral.
  lines:
    - line: 0
      source: GPIO
      type: configurable
      notes: Port selected via EXTI_EXTICR1.EXTI0
    - line: 1
      source: GPIO
      type: configurable
      notes: Port selected via EXTI_EXTICR1.EXTI1
    - line: 2
      source: GPIO
      type: configurable
      notes: Port selected via EXTI_EXTICR1.EXTI2
    - line: 3
      source: GPIO
      type: configurable
