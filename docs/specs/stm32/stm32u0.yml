boot:
  references:
    section: "2.5"
    tables: [6]
  note: >-
    Boot mode is governed by five inputs from RM0503 Table 6. When
    nBOOT_SEL=0 the physical BOOT0 pin is used; when nBOOT_SEL=1 the
    nBOOT0 option bit replaces the pin. Setting BOOT_LOCK=1 overrides
    all other inputs and forces boot from main flash memory.
  modes:
    - name: main-flash-pin
      conditions:
        BOOT_LOCK: "0"
        nBOOT_SEL: "0"
        BOOT0_pin: "0"
        nBOOT1: "x"
        nBOOT0: "x"
      source: Main flash memory
    - name: system-memory-pin
      conditions:
        BOOT_LOCK: "0"
        nBOOT_SEL: "0"
        BOOT0_pin: "1"
        nBOOT1: "1"
        nBOOT0: "x"
      source: System memory
    - name: sram-pin
      conditions:
        BOOT_LOCK: "0"
        nBOOT_SEL: "0"
        BOOT0_pin: "1"
        nBOOT1: "0"
        nBOOT0: "x"
      source: Embedded SRAM
    - name: main-flash-opt
      conditions:
        BOOT_LOCK: "0"
        nBOOT_SEL: "1"
        nBOOT0: "1"
        nBOOT1: "x"
        BOOT0_pin: "x"
      source: Main flash memory
    - name: system-memory-opt
      conditions:
        BOOT_LOCK: "0"
        nBOOT_SEL: "1"
        nBOOT0: "0"
        nBOOT1: "1"
        BOOT0_pin: "x"
      source: System memory
    - name: sram-opt
      conditions:
        BOOT_LOCK: "0"
        nBOOT_SEL: "1"
        nBOOT0: "0"
        nBOOT1: "0"
        BOOT0_pin: "x"
      source: Embedded SRAM
    - name: main-flash-locked
      conditions:
        BOOT_LOCK: "1"
        nBOOT_SEL: "x"
        BOOT0_pin: "x"
        nBOOT1: "x"
        nBOOT0: "x"
      source: Main flash memory (forced)

