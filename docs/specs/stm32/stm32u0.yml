        LPUART1 and LPUART2 are present on all sub-families (stm32u031, stm32u073, stm32u083).
        LPUART3 is present only on stm32u073 and stm32u083; it is absent on stm32u031.
        All LPUART instances implement the Low-power feature set column from
        the USART feature set table (Table 200, RM0503 §34.4).
      instances:
        - name: LPUART1
          base: 0x40008000
          sub-families: [stm32u031, stm32u073, stm32u083]
          feature-set: low-power-feature-set
        - name: LPUART2
          base: 0x40008400
          sub-families: [stm32u031, stm32u073, stm32u083]
          feature-set: low-power-feature-set
        - name: LPUART3
          base: 0x40008C00
          sub-families: [stm32u073, stm32u083]
          feature-set: low-power-feature-set
