definitions:
  settings:
    # Architecture-generic: canonical definition lives in docs/specs/common/arch/cortex-m0plus.yml.
    # Repeated here because YAML anchors cannot span files.
    gpio-mode: &gpio-mode
      "00": input mode
      "01": general purpose output mode
      "10": alternate function mode
      "11": analogue mode
    output-type: &output-type
      "0": Output push-pull
      "1": Output open-drain
    ospeed: &ospeed
      "00": Low speed
      "01": Medium speed
      "10": High speed
      "11": Very high speed
    pupdr: &pupdr
      "00": No pull-up, pull-down
      "01": Pull-up
      "10": Pull-down
      "11": Reserved
    # Architecture-generic: canonical definition lives in docs/specs/common/arch/cortex-m0plus.yml.
    # Repeated here because YAML anchors cannot span files.
    bit-value: &bit-value
      "0": reset
      "1": set
    bsrr-br: &bsrr-br
      "0": No action on the corresponding ODx bit
      "1": Resets the corresponding ODx bit
    bsrr-bs: &bsrr-bs
      "0": No action on the corresponding ODx bit
      "1": Sets the corresponding ODx bit
    port-lock: &port-lock
      "0": Port configuration not locked
      "1": Port configuration locked
    afsel: &afsel
      "0000": AF0
      "0001": AF1
      "0010": AF2
      "0011": AF3
      "0100": AF4
      "0101": AF5
      "0110": AF6
      "0111": AF7
      "1000": AF8
      "1001": AF9
      "1010": AF10
      "1011": AF11
      "1100": AF12
      "1101": AF13
      "1110": AF14
      "1111": AF15
    brr: &brr
      "0": No action on the corresponding ODx bit
      "1": Reset the corresponding ODx bit
    # USART/LPUART shared settings
    uart-fifo-enable: &uart-fifo-enable
      "0": FIFO mode disabled
      "1": FIFO mode enabled
    uart-mme: &uart-mme
      "0": Receiver in active mode permanently
      "1": Receiver can switch between mute and active mode
    uart-wake: &uart-wake
      "0": Idle line
      "1": Address mark
    uart-pce: &uart-pce
      "0": Parity control disabled
      "1": Parity control enabled
    uart-ps: &uart-ps
      "0": Even parity
      "1": Odd parity
    uart-te: &uart-te
      "0": Transmitter disabled
      "1": Transmitter enabled
    uart-re: &uart-re
      "0": Receiver disabled
      "1": Receiver enabled
    uart-msbfirst: &uart-msbfirst
      "0": data is transmitted/received with data bit 0 first
      "1": data is transmitted/received with MSB first
    uart-datainv: &uart-datainv
      "0": Logical data from the data register are sent/received in positive logic
      "1": Logical data from the data register are sent/received in negative logic
    uart-txinv: &uart-txinv
      "0": TX pin signal works using the standard logic levels
      "1": TX pin signal values are inverted
    uart-rxinv: &uart-rxinv
      "0": RX pin signal works using the standard logic levels
      "1": RX pin signal values are inverted
    uart-swap: &uart-swap
      "0": TX/RX pins are used as defined in standard pinout
      "1": TX and RX pins functions are swapped
    uart-fifo-tx-threshold: &uart-fifo-tx-threshold
      "000": TXFIFO reaches 1/8 of its depth
      "001": TXFIFO reaches 1/4 of its depth
      "010": TXFIFO reaches 1/2 of its depth
      "011": TXFIFO reaches 3/4 of its depth
      "100": TXFIFO reaches 7/8 of its depth
      "101": TXFIFO is empty
    uart-fifo-rx-threshold: &uart-fifo-rx-threshold
      "000": RXFIFO reaches 1/8 of its depth
      "001": RXFIFO reaches 1/4 of its depth
      "010": RXFIFO reaches 1/2 of its depth
      "011": RXFIFO reaches 3/4 of its depth
      "100": RXFIFO reaches 7/8 of its depth
      "101": RXFIFO is full
    uart-wus: &uart-wus
      "00": WUF active on address match
      "10": WUF active on start bit detection
      "11": WUF active on RXFNE or RXFF
    uart-dep: &uart-dep
      "0": DE signal is active high
      "1": DE signal is active low
    uart-dem: &uart-dem
      "0": DE function disabled
      "1": DE function enabled
    uart-ddre: &uart-ddre
      "0": DMA is not disabled in case of reception error
      "1": DMA is disabled following a reception error
    uart-ovrdis: &uart-ovrdis
      "0": Overrun error flag and interrupt enabled
      "1": Overrun functionality disabled
    uart-ctse: &uart-ctse
      "0": CTS hardware flow control disabled
      "1": CTS hardware flow control enabled
    uart-rtse: &uart-rtse
      "0": RTS hardware flow control disabled
      "1": RTS hardware flow control enabled
    uart-dmat: &uart-dmat
      "0": DMA mode disabled for transmission
      "1": DMA mode enabled for transmission
    uart-dmar: &uart-dmar
      "0": DMA mode disabled for reception
      "1": DMA mode enabled for reception
    uart-hdsel: &uart-hdsel
      "0": Half-duplex mode not selected
      "1": Half-duplex mode selected
    uart-rwu: &uart-rwu
      "0": Receiver in active mode
      "1": Receiver in mute mode
    uart-sbkf: &uart-sbkf
      "0": No break character transmitted
      "1": Break character transmitted
    uart-cts-line: &uart-cts-line
      "0": CTS line set
      "1": CTS line reset
    uart-interrupt-enable: &uart-interrupt-enable
      "0": Interrupt inhibited
      "1": Interrupt enabled
    uart-request: &uart-request
      "0": No action
      "1": Request asserted
    uart-clear-flag: &uart-clear-flag
      "0": No effect
      "1": Clears the corresponding flag in ISR
    uart-prescaler: &uart-prescaler
      "0000": input clock not divided
      "0001": input clock divided by 2
      "0010": input clock divided by 4
      "0011": input clock divided by 6
      "0100": input clock divided by 8
      "0101": input clock divided by 10
      "0110": input clock divided by 12
      "0111": input clock divided by 16
      "1000": input clock divided by 32
      "1001": input clock divided by 64
      "1010": input clock divided by 128
      "1011": input clock divided by 256
