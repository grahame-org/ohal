gpio-exti:
  reference:
    section: "7.3.9"
  note: >-
    All GPIO ports (PA–PF) support external interrupt via EXTI lines 0-15.
    The pin must NOT be configured in analog mode to use interrupt capability.
    Port/pin routing to EXTI line is controlled by EXTI_EXTICRx registers.
  exti-lines: "0-15"
  supported-ports: [PA, PB, PC, PD, PE, PF]
  pin-modes-allowed: [input, output, alternate_function]
  pin-modes-forbidden: [analog]
