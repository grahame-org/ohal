      interrupt-events:
        reference:
          section: 27.6
          tables: [159]
        note: >-
          All events are enabled via the LPTIM_DIER register.
          An interrupt is not asserted if the enable bit is set after the flag is already set.
          Direction-change events (UP/DOWN) only exist on LPTIM instances with encoder mode.
          Stop-mode wake-up is only available on LPTIM instances supporting that feature (§27.3).
        events:
          - event: Compare match
            flag: CCxIF
            enable-bit: CCxIE
            clear-method: Write 1 to CCxCF
            exit-sleep: true
            exit-stop: true
          - event: Input capture
            flag: CCxIF
            enable-bit: CCxIE
            clear-method: Write 1 to CCxCF
            exit-sleep: true
            exit-stop: true
          - event: Over-capture
            flag: CCxOF
            enable-bit: CCxOIE
            clear-method: Write 1 to CCxOCF
            exit-sleep: true
            exit-stop: true
          - event: Auto-reload match
            flag: ARRM
            enable-bit: ARRMIE
            clear-method: Write 1 to ARRMCF
            exit-sleep: true
            exit-stop: true
          - event: External trigger event
            flag: EXTTRIG
            enable-bit: EXTTRIGIE
            clear-method: Write 1 to EXTTRIGCF
            exit-sleep: true
            exit-stop: true
          - event: Auto-reload register update OK
            flag: ARROK
            enable-bit: ARROKIE
            clear-method: Write 1 to ARROKCF
            exit-sleep: true
            exit-stop: true
          - event: Capture/compare register update OK
            flag: CMPxOK
            enable-bit: CMPxOKIE
            clear-method: Write 1 to CMPxOKCF
            exit-sleep: true
            exit-stop: true
          - event: Direction change to up
            flag: UP
            enable-bit: UPIE
            clear-method: Write 1 to UPCF
            exit-sleep: true
            exit-stop: true
            notes: Only on LPTIM instances with encoder mode support
          - event: Direction change to down
            flag: DOWN
            enable-bit: DOWNIE
            clear-method: Write 1 to DOWNCF
            exit-sleep: true
            exit-stop: true
            notes: Only on LPTIM instances with encoder mode support
          - event: Update event
            flag: UE
            enable-bit: UEIE
            clear-method: Write 1 to UECF
            exit-sleep: true
            exit-stop: true
          - event: Repetition register update OK
            flag: REPOK
            enable-bit: REPOKIE
            clear-method: Write 1 to REPOKCF
            exit-sleep: true
            exit-stop: true
        low-power-modes:
          sleep: No effect. LPTIM interrupts cause the device to exit Sleep mode.
          stop: >-
            If the LPTIM is clocked by an oscillator available in Stop mode, LPTIM is
            functional and the interrupts cause the device to exit Stop mode.
          standby: >-
            The LPTIM peripheral is powered down and must be reinitialized after
            exiting Standby mode.

