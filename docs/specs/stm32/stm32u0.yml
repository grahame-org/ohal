      description: DMA1 channel 2 & 3 interrupts
      address: "0x0000_0068"
    - position: 11
      acronym: DMA1_Channel4_5_6_7_DMAMUX_DMA2_Channel1_2_3_4_5
      description: >-
        DMA1 channel 4, 5, 6, 7, DMAMUX, DMA2 channel 1, 2, 3, 4, 5 interrupts
      address: "0x0000_006C"
    - position: 12
      acronym: ADC_COMP
      description: ADC and COMP interrupts (ADC combined with EXTI lines 17 & 18)
