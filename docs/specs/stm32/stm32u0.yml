      interrupt-events:
        reference:
          section: 34.7
          tables: [208]
        note: >-
          Applies to USART and UART instances.
          Stop-mode wake-up requires the instance to support it (see §34.4).
          All DMA requests must be disabled before entering Sleep/Stop/Standby.
        events:
          - event: Transmit data register empty
            flag: TXE
            enable-bit: TXEIE
            clear-method: Write TDR
            exit-sleep: true
            exit-stop: false
          - event: Transmit FIFO not full
            flag: TXFNF
            enable-bit: TXFNFIE
            clear-method: TXFIFO full
            exit-stop: false
          - event: Transmit FIFO empty
            flag: TXFE
            enable-bit: TXFEIE
            clear-method: Write TDR or write 1 in TXFRQ
            exit-sleep: true
          - event: Transmit FIFO threshold reached
            flag: TXFT
            enable-bit: TXFTIE
            clear-method: Write TDR
            exit-sleep: true
            notes: Writing TDR clears TXFT only if empty locations < TXFTCFG[2:0]
          - event: CTS interrupt
            flag: CTSIF
            enable-bit: CTSIE
            clear-method: Write 1 in CTSCF
            exit-stop: false
          - event: Transmission complete
            flag: TC
            enable-bit: TCIE
            clear-method: Write TDR or write 1 in TCCF
            exit-stop: false
          - event: Transmission complete before guard time
            flag: TCBGT
            enable-bit: TCBGTIE
            clear-method: Write TDR or write 1 in TCBGTCF
            exit-stop: false
          - event: Receive data register not empty
            flag: RXNE
            enable-bit: RXNEIE
            clear-method: Read RDR or write 1 in RXFRQ
            exit-sleep: true
            exit-stop: true
          - event: Receive FIFO not empty
            flag: RXFNE
            enable-bit: RXFNEIE
            clear-method: Read RDR until RXFIFO empty or write 1 in RXFRQ
            exit-sleep: true
          - event: Receive FIFO full
            flag: RXFF
            enable-bit: RXFFIE
            clear-method: Read RDR
            exit-sleep: true
          - event: Receive FIFO threshold reached
            flag: RXFT
            enable-bit: RXFTIE
            clear-method: Read RDR
            exit-sleep: true
          - event: Overrun error detected
            flag: ORE
            enable-bit: RXNEIE_or_RXFNEIE
            clear-method: Write 1 in ORECF
            exit-stop: false
          - event: Idle line detected
            flag: IDLE
            enable-bit: IDLEIE
            clear-method: Write 1 in IDLECF
            exit-stop: false
          - event: Parity error
            flag: PE
            enable-bit: PEIE
            clear-method: Write 1 in PECF
            exit-stop: false
          - event: LIN break
            flag: LBDF
            enable-bit: LBDIE
            clear-method: Write 1 in LBDCF
            exit-stop: false
          - event: Noise error (multibuffer communication)
            flag: NE
            enable-bit: EIE
            clear-method: Write 1 in NECF
            exit-stop: false
          - event: Overrun error (multibuffer communication)
            flag: ORE
            enable-bit: EIE
            clear-method: Write 1 in ORECF
            notes: When OVRDIS = 0
          - event: Framing error (multibuffer communication)
            flag: FE
            enable-bit: EIE
            clear-method: Write 1 in FECF
          - event: Character match
            flag: CMF
            enable-bit: CMIE
            clear-method: Write 1 in CMCF
            exit-stop: false
          - event: Receiver timeout
            flag: RTOF
            enable-bit: RTOFIE
            clear-method: Write 1 in RTOCF
            exit-stop: false
          - event: End of Block
            flag: EOBF
            enable-bit: EOBIE
            clear-method: Write 1 in EOBCF
            exit-stop: false
          - event: Wake-up from low-power mode
            flag: WUF
            enable-bit: WUFIE
            clear-method: Write 1 in WUCF
            exit-sleep: true
          - event: SPI slave underrun error
            flag: UDR
            enable-bit: EIE
            clear-method: Write 1 in UDRCF
        low-power-modes:
          sleep: No effect. USART interrupts cause the device to exit Sleep mode.
          stop: >-
            USART content is kept. Can wake the MCU from Stop mode when clocked by
            an oscillator available in Stop mode. Instances not functional in a given
            Stop mode must be disabled before entering it.
          standby: >-
            USART peripheral is powered down and must be reinitialized after exiting
            Standby mode.
  - lpuart:
      reference:
        sections: [34.4, 35.7]
        tables: [199, 200, 214]
      note: >-
        Instance availability is defined in Table 199 (RM0503 §34.4).
        LPUART1 and LPUART2 are present on all sub-families (stm32u031, stm32u073, stm32u083).
        LPUART3 is present only on stm32u073 and stm32u083; it is absent on stm32u031.
        All LPUART instances implement the Low-power feature set column from
        the USART feature set table (Table 200, RM0503 §34.4).
      instances:
        - name: LPUART1
          base: 0x40008000
          sub-families: [stm32u031, stm32u073, stm32u083]
          feature-set: low-power-feature-set
        - name: LPUART2
          base: 0x40008400
          sub-families: [stm32u031, stm32u073, stm32u083]
          feature-set: low-power-feature-set
        - name: LPUART3
          base: 0x40008C00
          sub-families: [stm32u073, stm32u083]
          feature-set: low-power-feature-set
      registers:
        - CR1:
            reference:
              section: 35.7.1
            offset: 0x00
            note: >-
              Two layouts exist for this register depending on the FIFOEN bit.
              Section 35.7.1 documents the FIFO-enabled layout (FIFOEN=1);
              section 35.7.2 documents the FIFO-disabled layout (FIFOEN=0).
            fields:
              - name: RXFFIE
                msb: 31
                lsb: 31
                width: 1
                access: rw
                note: FIFO mode only
                settings: *uart-interrupt-enable
              - name: TXFEIE
                msb: 30
                lsb: 30
                width: 1
                access: rw
                note: FIFO mode only
