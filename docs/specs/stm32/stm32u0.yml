gpio-exti:
  reference:
    section: "7.3.9"
  note: >-
    All GPIO ports (PA–PF) support external interrupt via EXTI lines 0-15.
    The pin must NOT be configured in analog mode to use interrupt capability.
    Port/pin routing to EXTI line is controlled by EXTI_EXTICRx registers.
  exti-lines: "0-15"
  supported-ports: [PA, PB, PC, PD, PE, PF]
  pin-modes-allowed: [input, output, alternate_function]
  pin-modes-forbidden: [analog]

low-power-modes:
  references:
    section: "4.3"
    tables: [21]
  note: >-
    Table 21 rows for Sleep and Low-power sleep each span two sub-rows in the
    PDF (WFI/Return-from-ISR and WFE variants); the entry and wakeup-source
    fields consolidate both sub-rows per mode. Stop 1 and Stop 2 share the
    same wake-up source, wakeup-clock, and effect-on-clocks as Stop 0, and
    Stop 1 and Stop 2 share the same lp-regulator state as Stop 0 (blank
    cells in the extracted table indicate inherited values; consolidated here
    for completeness). Stop 1 MR is explicitly OFF in the table; Stop 2 MR
    inherits OFF from Stop 1. Standby wakeup-clock inherits from Standby with
    SRAM2. Standby with SRAM2 regulator states are blank in the PDF and are
    inferred as OFF/OFF matching Standby. See Table 22 (P4-S2b) for
    per-peripheral mode availability.
  modes:
    - name: "Sleep (Sleep-now or Sleep-on-exit)"
      entry: "WFI or Return from ISR, or WFE"
      wakeup-source: >-
        Any interrupt (via WFI or Return from ISR); wake-up event (via WFE)
      wakeup-clock: "Same as before entering Sleep mode"
      effect-on-clocks: >-
        CPU clock OFF; no effect on other clocks or analog clock sources
      main-regulator: "on"
      lp-regulator: "on"
    - name: "Low-power run"
      entry: "Set LPR bit"
      wakeup-source: "Clear LPR bit"
      wakeup-clock: "Same as Low-power run clock"
      effect-on-clocks: "None"
      main-regulator: "off"
      lp-regulator: "on"
    - name: "Low-power sleep"
      entry: >-
        Set LPR bit + WFI or Return from ISR, or Set LPR bit + WFE
      wakeup-source: >-
        Any interrupt (via WFI or Return from ISR); wake-up event (via WFE)
      wakeup-clock: "Same as before entering Low-power sleep mode"
      effect-on-clocks: >-
        CPU clock OFF; no effect on other clocks or analog clock sources
      main-regulator: "off"
      lp-regulator: "on"
    - name: "Stop 0"
      entry: >-
        LPMS="000" + SLEEPDEEP bit + WFI or Return from ISR or WFE
      wakeup-source: >-
        Any EXTI line (configured in the EXTI registers); specific peripherals
        events
      wakeup-clock: >-
        HSI16 when STOPWUCK=1 in RCC_CFGR; MSI with the frequency before
        entering the Stop mode when STOPWUCK=0
      effect-on-clocks: "All clocks OFF except LSI and LSE"
      main-regulator: "on"
      lp-regulator: "on"
    - name: "Stop 1"
      entry: >-
        LPMS="001" + SLEEPDEEP bit + WFI or Return from ISR or WFE
      wakeup-source: >-
        Any EXTI line (configured in the EXTI registers); specific peripherals
        events
      wakeup-clock: >-
        HSI16 when STOPWUCK=1 in RCC_CFGR; MSI with the frequency before
        entering the Stop mode when STOPWUCK=0
      effect-on-clocks: "All clocks OFF except LSI and LSE"
      main-regulator: "off"
      lp-regulator: "on"
    - name: "Stop 2"
      entry: >-
        LPMS="010" + SLEEPDEEP bit + WFI or Return from ISR or WFE
      wakeup-source: >-
        Any EXTI line (configured in the EXTI registers); specific peripherals
        events
      wakeup-clock: >-
        HSI16 when STOPWUCK=1 in RCC_CFGR; MSI with the frequency before
        entering the Stop mode when STOPWUCK=0
      effect-on-clocks: "All clocks OFF except LSI and LSE"
      main-regulator: "off"
      lp-regulator: "on"
    - name: "Standby with SRAM2"
      entry: >-
        LPMS="011" + Set RRS bit + SLEEPDEEP bit + WFI or Return from ISR or
        WFE
      wakeup-source: >-
        WKUP pin edge, RTC event, external reset on NRST pin, IWDG reset
      wakeup-clock: "MSI from 1 MHz up to 8 MHz"
      main-regulator: "off"
      lp-regulator: "off"
    - name: "Standby"
      entry: >-
        LPMS="011" + Clear RRS bit + SLEEPDEEP bit + WFI or Return from ISR or
        WFE
      wakeup-source: >-
        WKUP pin edge, RTC event, external reset on NRST pin, IWDG reset
      wakeup-clock: "MSI from 1 MHz up to 8 MHz"
      main-regulator: "off"
      lp-regulator: "off"
    - name: "Shutdown"
      entry: >-
        LPMS="1--" + SLEEPDEEP bit + WFI or Return from ISR or WFE
      wakeup-source: "WKUP pin edge, RTC event, external reset on NRST pin"
      wakeup-clock: "MSI 4 MHz"
      effect-on-clocks: "All clocks OFF except LSE"
      main-regulator: "off"
      lp-regulator: "off"

peripheral-mode-availability:
  references:
    section: "4.3"
    tables: [22]
  note: >-
    Table 22 spans pages 116-118. Column headers for Stop 0/1, Stop 2, Standby,
    and Shutdown each split into two sub-columns: the active capability ('-' header)
    and the wake-up capability ('Wake-up capability' header); these are captured as
    the *-active and *-wakeup fields respectively. Values: Y = always enabled,
    O = optional (disabled by default, can be enabled by software), - = not available.
    Footnote references appear in parentheses within cell values (e.g. 'O(1)',
    'O (5)', '5 pins (10)'). The 'Number of RTC Tamper pins' row uses numeric value
    '5' meaning five tamper pins are available. The GPIOs standby-active and
    shutdown-active cells use footnote-only values '(9)' and '(11)' respectively.
  footnotes:
    - number: 1
      text: >-
        The flash memory can be configured in power-down mode. By default, it is
        not in power-down mode.
    - number: 2
      text: The SRAM clock can be gated on or off.
    - number: 3
      text: SRAM2 content is preserved when the bit RRS is set in PWR_CR3 register.
    - number: 4
      text: >-
        Some peripherals with wake-up from Stop capability can request HSI16 to be
        enabled. In this case, HSI16 is woken up by the peripheral, and only feeds
        the peripheral which requested it. HSI16 is automatically put off when the
        peripheral does not need it anymore.
    - number: 5
      text: >-
        UART and LPUART reception is functional in Stop mode, and generates a
        wake-up interrupt on Start, address match or received frame event.
    - number: 6
      text: >-
        I2C address detection is functional in Stop mode, and generates a wake-up
        interrupt in case of address match.
    - number: 7
      text: >-
        USB bus state monitoring is functional in Stop mode. It generates a wake-up
        interrupt upon resume from USB suspend.
    - number: 8
      text: "Voltage scaling Range 1 only."
    - number: 9
      text: >-
        I/Os can be configured with internal pull-up, pull-down or floating in
        Standby mode.
    - number: 10
      text: >-
        I/Os with wake-up from Standby/Shutdown capability are the following:
        PA0, PC13, PE6, PA2, PC5.
    - number: 11
      text: >-
        I/Os can be configured with internal pull-up, pull-down or floating in
        Shutdown mode but the configuration is lost when exiting the Shutdown mode.
  entries:
    - peripheral: CPU
      run: "Y"
      sleep: "-"
      low-power-run: "Y"
      low-power-sleep: "-"
      stop01-active: "-"
      stop01-wakeup: "-"
      stop2-active: "-"
      stop2-wakeup: "-"
      standby-active: "-"
      standby-wakeup: "-"
      shutdown-active: "-"
      shutdown-wakeup: "-"
      vbat: "-"
    - peripheral: Flash memory
      run: "O(1)"
      sleep: "O(1)"
      low-power-run: "O(1)"
      low-power-sleep: "O(1)"
      stop01-active: "-"
      stop01-wakeup: "-"
      stop2-active: "-"
      stop2-wakeup: "-"
      standby-active: "-"
      standby-wakeup: "-"
      shutdown-active: "-"
      shutdown-wakeup: "-"
      vbat: "-"
    - peripheral: SRAM1
