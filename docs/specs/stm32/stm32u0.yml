  reference:
    section: "11"
    tables: [55]
  note: >-
    System-exception priority numbers below are the architectural priority values
    as listed in RM0503 table 55.
  priority-bits: 2
  priority-levels: 4
  maskable-channels: 32
  systick-calibration: 1000
  system-exceptions:
    - acronym: Reset
      priority: -3
      priority-type: fixed
      address: "0x0000_0004"
    - acronym: NMI_Handler
      priority: -2
      priority-type: fixed
      description: >-
