      sleep: "Y(2)"
      low-power-run: "Y"
      low-power-sleep: "Y(2)"
      stop01-active: "Y"
      stop01-wakeup: "-"
      stop2-active: "Y"
      stop2-wakeup: "-"
      standby-active: "-"
