            full-feature-set: true
            basic-feature-set: true
            low-power-feature-set: false
          - name: Smartcard mode
            full-feature-set: true
            basic-feature-set: false
            low-power-feature-set: false
          - name: Single-wire half-duplex communication
            full-feature-set: true
            basic-feature-set: true
            low-power-feature-set: true
          - name: IrDA SIR ENDEC block
            full-feature-set: true
            basic-feature-set: false
            low-power-feature-set: false
          - name: LIN mode
            full-feature-set: true
            basic-feature-set: false
            low-power-feature-set: false
          - name: Dual clock domain and wake-up from low-power mode
            full-feature-set: true
            basic-feature-set: false
            low-power-feature-set: true
          - name: Receiver timeout interrupt
            full-feature-set: true
            basic-feature-set: false
            low-power-feature-set: false
