                note: >-
                  MCO output prescaler. 0000: /1; 0001: /2; 0010: /4; 0011:
                  /8; 0100: /16; 0101: /32; 0110: /64; 0111: /128; 1000:
                  /256; 1001: /512; 1010: /1024. Others reserved. Recommended
                  to set before enabling MCO output.
                settings: ~
              - name: MCOSEL
                msb: 27
                lsb: 24
                width: 4
                access: rw
                settings:
                  "0000": no clock, MCO output disabled
                  "0001": SYSCLK
                  "0010": MSI
                  "0011": HSI16
                  "0100": HSE
                  "0101": PLLRCLK
                  "0110": LSI
                  "0111": LSE
                  "1000": HSI48
                  "1001": RTCCLK
                  "1010": RTC wakeup
              - name: MCO2PRE
                msb: 23
                lsb: 20
                width: 4
                access: rw
                note: >-
                  MCO2 output prescaler. 0000: /1; 0001: /2; 0010: /4; 0011:
                  /8; 0100: /16; 0101: /32; 0110: /64; 0111: /128; 1000:
                  /256; 1001: /512; 1010: /1024. Others reserved. Recommended
                  to set before enabling MCO2 output.
                settings: ~
              - name: MCO2SEL
                msb: 19
                lsb: 16
                width: 4
                access: rw
                settings:
                  "0000": no clock, MCO2 output disabled
                  "0001": SYSCLK
                  "0010": MSI
                  "0011": HSI16
                  "0100": HSE
                  "0101": PLLRCLK
                  "0110": LSI
                  "0111": LSE
                  "1000": HSI48
                  "1001": RTCCLK
                  "1010": RTC wakeup
