                settings: ~
              - name: HPRE
                msb: 11
                lsb: 8
                width: 4
                access: rw
                note: >-
                  AHB prescaler. 0xxx: SYSCLK not divided; 1000: /2; 1001:
                  /4; 1010: /8; 1011: /16; 1100: /64; 1101: /128; 1110:
                  /256; 1111: /512.
                settings: ~
              - name: RESERVED
