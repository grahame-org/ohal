definitions:
  settings:
    # Architecture-generic: canonical definition lives in docs/specs/common/arch/cortex-m0plus.yml.
    # Repeated here because YAML anchors cannot span files.
    gpio-mode: &gpio-mode
      "00": input mode
      "01": general purpose output mode
      "10": alternate function mode
      "11": analogue mode
    output-type: &output-type
      "0": Output push-pull
      "1": Output open-drain
    ospeed: &ospeed
      "00": Low speed
      "01": Medium speed
      "10": High speed
      "11": Very high speed
    pupdr: &pupdr
      "00": No pull-up, pull-down
      "01": Pull-up
      "10": Pull-down
      "11": Reserved
    # Architecture-generic: canonical definition lives in docs/specs/common/arch/cortex-m0plus.yml.
    # Repeated here because YAML anchors cannot span files.
    bit-value: &bit-value
      "0": reset
      "1": set
    bsrr-br: &bsrr-br
      "0": No action on the corresponding ODx bit
      "1": Resets the corresponding ODx bit
    bsrr-bs: &bsrr-bs
      "0": No action on the corresponding ODx bit
      "1": Sets the corresponding ODx bit
    port-lock: &port-lock
      "0": Port configuration not locked
      "1": Port configuration locked
    afsel: &afsel
      "0000": AF0
      "0001": AF1
      "0010": AF2
      "0011": AF3
      "0100": AF4
      "0101": AF5
      "0110": AF6
      "0111": AF7
      "1000": AF8
      "1001": AF9
      "1010": AF10
      "1011": AF11
      "1100": AF12
      "1101": AF13
      "1110": AF14
      "1111": AF15
    brr: &brr
      "0": No action on the corresponding ODx bit
      "1": Reset the corresponding ODx bit
    # Timer shared settings
    tim-ckd: &tim-ckd
      "00": "tDTS=tCK_INT"
      "01": "tDTS=2*tCK_INT"
      "10": "tDTS=4*tCK_INT"
      "11": Reserved
    tim-cms: &tim-cms
      "00": Edge-aligned mode. The counter counts up or down depending on the direction bit (DIR).
      "01": "Center-aligned mode 1. Output compare interrupt flags set only when counting down."
      "10": "Center-aligned mode 2. Output compare interrupt flags set only when counting up."
      "11": "Center-aligned mode 3. Output compare interrupt flags set both when counting up or down."
    tim-mms: &tim-mms
      "000": "Reset - UG bit from TIMx_EGR used as trigger output (TRGO)"
      "001": "Enable - Counter Enable signal CNT_EN used as trigger output (TRGO)"
      "010": "Update - update event selected as trigger output (TRGO)"
      "011": "Compare Pulse - positive pulse when CC1IF flag is set (TRGO)"
      "100": "Compare - OC1REFC signal used as trigger output (TRGO)"
      "101": "Compare - OC2REFC signal used as trigger output (TRGO)"
      "110": "Compare - OC3REFC signal used as trigger output (TRGO)"
      "111": "Compare - OC4REFC signal used as trigger output (TRGO)"
    tim-mms2: &tim-mms2
      "0000": "Reset - UG bit from TIMx_EGR used as trigger output (TRGO2)"
      "0001": "Enable - Counter Enable signal CNT_EN used as trigger output (TRGO2)"
      "0010": "Update - update event selected as trigger output (TRGO2)"
      "0011": "Compare Pulse - positive pulse when CC1IF flag is set (TRGO2)"
      "0100": "Compare - OC1REFC signal used as trigger output (TRGO2)"
      "0101": "Compare - OC2REFC signal used as trigger output (TRGO2)"
      "0110": "Compare - OC3REFC signal used as trigger output (TRGO2)"
      "0111": "Compare - OC4REFC signal used as trigger output (TRGO2)"
      "1000": "Compare - OC5REFC signal used as trigger output (TRGO2)"
      "1001": "Compare - OC6REFC signal used as trigger output (TRGO2)"
      "1010": "Compare Pulse - OC4REFC rising or falling edges generate pulses on TRGO2"
      "1011": "Compare Pulse - OC6REFC rising or falling edges generate pulses on TRGO2"
      "1100": "Compare Pulse - OC4REFC or OC6REFC rising edges generate pulses on TRGO2"
      "1101": "Compare Pulse - OC4REFC rising or OC6REFC falling edges generate pulses on TRGO2"
      "1110": "Compare Pulse - OC5REFC or OC6REFC rising edges generate pulses on TRGO2"
      "1111": "Compare Pulse - OC5REFC rising or OC6REFC falling edges generate pulses on TRGO2"
    tim-sms: &tim-sms
      "0000": Slave mode disabled
      "0001": Encoder mode 1 - Counter counts up/down on TI1FP1 edge depending on TI2FP2 level
      "0010": Encoder mode 2 - Counter counts up/down on TI2FP2 edge depending on TI1FP1 level
      "0011": Encoder mode 3 - Counter counts up/down on both TI1FP1 and TI2FP2 edges
      "0100": Reset Mode - Rising edge of TRGI reinitializes the counter and generates an update
      "0101": Gated Mode - Counter clock enabled when TRGI is high
      "0110": Trigger Mode - Counter starts at rising edge of TRGI
      "0111": External Clock Mode 1 - Rising edges of TRGI clock the counter
      "1000": Combined reset + trigger mode - Rising edge of TRGI reinitializes and starts counter
    tim-ts: &tim-ts
      "00000": Internal Trigger 0 (ITR0)
      "00001": Internal Trigger 1 (ITR1)
      "00010": Internal Trigger 2 (ITR2)
      "00011": Internal Trigger 3 (ITR3)
      "00100": TI1 Edge Detector (TI1F_ED)
      "00101": Filtered Timer Input 1 (TI1FP1)
      "00110": Filtered Timer Input 2 (TI2FP2)
      "00111": External Trigger input (ETRF)
    tim-etps: &tim-etps
      "00": Prescaler OFF
      "01": ETRP frequency divided by 2
      "10": ETRP frequency divided by 4
      "11": ETRP frequency divided by 8
    tim-filter: &tim-filter
      "0000": "No filter, sampling is done at fDTS"
      "0001": "fSAMPLING=fCK_INT, N=2"
      "0010": "fSAMPLING=fCK_INT, N=4"
      "0011": "fSAMPLING=fCK_INT, N=8"
      "0100": "fSAMPLING=fDTS/2, N=6"
      "0101": "fSAMPLING=fDTS/2, N=8"
      "0110": "fSAMPLING=fDTS/4, N=6"
      "0111": "fSAMPLING=fDTS/4, N=8"
      "1000": "fSAMPLING=fDTS/8, N=6"
      "1001": "fSAMPLING=fDTS/8, N=8"
      "1010": "fSAMPLING=fDTS/16, N=5"
      "1011": "fSAMPLING=fDTS/16, N=6"
      "1100": "fSAMPLING=fDTS/16, N=8"
      "1101": "fSAMPLING=fDTS/32, N=5"
      "1110": "fSAMPLING=fDTS/32, N=6"
      "1111": "fSAMPLING=fDTS/32, N=8"
    tim-ic-psc: &tim-ic-psc
      "00": no prescaler, capture done each time an edge is detected
      "01": capture done once every 2 events
      "10": capture done once every 4 events
      "11": capture done once every 8 events
    tim-cc1s: &tim-cc1s
      "00": CC1 channel configured as output
      "01": "CC1 configured as input, IC1 mapped on TI1"
      "10": "CC1 configured as input, IC1 mapped on TI2"
      "11": "CC1 configured as input, IC1 mapped on TRC"
    tim-cc2s: &tim-cc2s
      "00": CC2 channel configured as output
      "01": "CC2 configured as input, IC2 mapped on TI2"
      "10": "CC2 configured as input, IC2 mapped on TI1"
      "11": "CC2 configured as input, IC2 mapped on TRC"
    tim-cc3s: &tim-cc3s
      "00": CC3 channel configured as output
      "01": "CC3 configured as input, IC3 mapped on TI3"
      "10": "CC3 configured as input, IC3 mapped on TI4"
      "11": "CC3 configured as input, IC3 mapped on TRC"
    tim-cc4s: &tim-cc4s
      "00": CC4 channel configured as output
      "01": "CC4 configured as input, IC4 mapped on TI4"
      "10": "CC4 configured as input, IC4 mapped on TI3"
      "11": "CC4 configured as input, IC4 mapped on TRC"
    tim-ocm: &tim-ocm
      "0000": Frozen - no effect on outputs
      "0001": Set channel to active level on match
      "0010": Set channel to inactive level on match
      "0011": Toggle
      "0100": Force inactive level
      "0101": Force active level
      "0110": "PWM mode 1 - active while CNT<CCR in upcounting"
      "0111": "PWM mode 2 - inactive while CNT<CCR in upcounting"
      "1000": Retriggerable OPM mode 1
      "1001": Retriggerable OPM mode 2
      "1010": Reserved
      "1011": Reserved
      "1100": Combined PWM mode 1
      "1101": Combined PWM mode 2
      "1110": Asymmetric PWM mode 1
      "1111": Asymmetric PWM mode 2
    tim-ie: &tim-ie
      "0": Interrupt disabled
      "1": Interrupt enabled
    tim-de: &tim-de
      "0": DMA request disabled
      "1": DMA request enabled
    tim-lock: &tim-lock
      "00": LOCK OFF - No bit is write protected
      "01": LOCK Level 1
      "10": LOCK Level 2
      "11": LOCK Level 3
    tim-etrsel: &tim-etrsel
      "0000": ETR legacy mode
      "0001": COMP1 output
      "0010": COMP2 output
      "0011": ADC1 AWD1
      "0100": ADC1 AWD2
      "0101": ADC1 AWD3
    # USART/LPUART shared settings
    uart-fifo-enable: &uart-fifo-enable
      "0": FIFO mode disabled
      "1": FIFO mode enabled
    uart-mme: &uart-mme
      "0": Receiver in active mode permanently
      "1": Receiver can switch between mute and active mode
    uart-wake: &uart-wake
      "0": Idle line
      "1": Address mark
    uart-pce: &uart-pce
      "0": Parity control disabled
      "1": Parity control enabled
    uart-ps: &uart-ps
      "0": Even parity
      "1": Odd parity
    uart-te: &uart-te
      "0": Transmitter disabled
      "1": Transmitter enabled
    uart-re: &uart-re
      "0": Receiver disabled
      "1": Receiver enabled
    uart-msbfirst: &uart-msbfirst
      "0": data is transmitted/received with data bit 0 first
      "1": data is transmitted/received with MSB first
    uart-datainv: &uart-datainv
      "0": Logical data from the data register are sent/received in positive logic
      "1": Logical data from the data register are sent/received in negative logic
    uart-txinv: &uart-txinv
      "0": TX pin signal works using the standard logic levels
      "1": TX pin signal values are inverted
    uart-rxinv: &uart-rxinv
      "0": RX pin signal works using the standard logic levels
      "1": RX pin signal values are inverted
    uart-swap: &uart-swap
      "0": TX/RX pins are used as defined in standard pinout
      "1": TX and RX pins functions are swapped
    uart-fifo-tx-threshold: &uart-fifo-tx-threshold
      "000": TXFIFO reaches 1/8 of its depth
      "001": TXFIFO reaches 1/4 of its depth
      "010": TXFIFO reaches 1/2 of its depth
      "011": TXFIFO reaches 3/4 of its depth
      "100": TXFIFO reaches 7/8 of its depth
      "101": TXFIFO is empty
    uart-fifo-rx-threshold: &uart-fifo-rx-threshold
      "000": RXFIFO reaches 1/8 of its depth
      "001": RXFIFO reaches 1/4 of its depth
      "010": RXFIFO reaches 1/2 of its depth
      "011": RXFIFO reaches 3/4 of its depth
      "100": RXFIFO reaches 7/8 of its depth
      "101": RXFIFO is full
    uart-wus: &uart-wus
      "00": WUF active on address match
      "10": WUF active on start bit detection
      "11": WUF active on RXFNE or RXFF
    uart-dep: &uart-dep
      "0": DE signal is active high
      "1": DE signal is active low
    uart-dem: &uart-dem
      "0": DE function disabled
      "1": DE function enabled
    uart-ddre: &uart-ddre
      "0": DMA is not disabled in case of reception error
      "1": DMA is disabled following a reception error
    uart-ovrdis: &uart-ovrdis
      "0": Overrun error flag and interrupt enabled
      "1": Overrun functionality disabled
    uart-ctse: &uart-ctse
      "0": CTS hardware flow control disabled
      "1": CTS hardware flow control enabled
    uart-rtse: &uart-rtse
      "0": RTS hardware flow control disabled
      "1": RTS hardware flow control enabled
    uart-dmat: &uart-dmat
      "0": DMA mode disabled for transmission
      "1": DMA mode enabled for transmission
    uart-dmar: &uart-dmar
      "0": DMA mode disabled for reception
      "1": DMA mode enabled for reception
    uart-hdsel: &uart-hdsel
      "0": Half-duplex mode not selected
      "1": Half-duplex mode selected
    uart-rwu: &uart-rwu
      "0": Receiver in active mode
      "1": Receiver in mute mode
    uart-sbkf: &uart-sbkf
      "0": No break character transmitted
      "1": Break character transmitted
    uart-cts-line: &uart-cts-line
      "0": CTS line set
      "1": CTS line reset
    uart-interrupt-enable: &uart-interrupt-enable
      "0": Interrupt inhibited
      "1": Interrupt enabled
    uart-request: &uart-request
      "0": No action
      "1": Request asserted
    uart-clear-flag: &uart-clear-flag
      "0": No effect
      "1": Clears the corresponding flag in ISR
    uart-prescaler: &uart-prescaler
      "0000": input clock not divided
      "0001": input clock divided by 2
      "0010": input clock divided by 4
      "0011": input clock divided by 6
      "0100": input clock divided by 8
      "0101": input clock divided by 10
      "0110": input clock divided by 12
      "0111": input clock divided by 16
      "1000": input clock divided by 32
      "1001": input clock divided by 64
      "1010": input clock divided by 128
      "1011": input clock divided by 256
    # PWR shared settings
    pwr-lpms: &pwr-lpms
      "000": Stop 0 mode
      "001": Stop 1 mode
      "010": Stop 2 mode
      "011": Standby mode
      "100": Shutdown mode
      "101": Shutdown mode
      "110": Shutdown mode
      "111": Shutdown mode
    pwr-vos: &pwr-vos
      "00": forbidden
      "01": Range 1
      "10": Range 2
      "11": forbidden
    pwr-pls: &pwr-pls
      "000": VPVD0 around 2.0 V
      "001": VPVD1 around 2.2 V
      "010": VPVD2 around 2.4 V
      "011": VPVD3 around 2.5 V
      "100": VPVD4 around 2.6 V
      "101": VPVD5 around 2.8 V
      "110": VPVD6 around 2.9 V
      "111": external input analog voltage PVD_IN
    pwr-ewup: &pwr-ewup
      "0": wake-up pin disabled
      "1": wake-up pin enabled
    pwr-wp: &pwr-wp
      "0": detection on rising edge (active high)
      "1": detection on falling edge (active low)
    pwr-wuf: &pwr-wuf
      "0": no wake-up event detected
      "1": wake-up event detected
    pwr-stopf: &pwr-stopf
      "000": did not enter Stop mode
      "100": entered Stop 0 mode
      "101": entered Stop 1 mode
      "110": entered Stop 2 mode
    pwr-pu-bit: &pwr-pu-bit
      "0": pull-up inactive
      "1": pull-up activated
    pwr-pd-bit: &pwr-pd-bit
      "0": pull-down inactive
      "1": pull-down activated
