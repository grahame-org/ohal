      USART1, and USART4 through an internal mux to IR_OUT.
      This phase verifies that the SYSCFG_CFGR1 register in the
      spec already exposes these bits correctly, and records the
      IRTIM functional description as a cross-reference note.

    steps:
      - id: P40-S1
        title: "Verify SYSCFG_CFGR1 IR_MOD and IR_POL fields"
        description: >
          Confirm that SYSCFG_CFGR1 in stm32u0.yml already has
          IR_MOD[1:0] (bits 6:5) and IR_POL (bit 4) fields.
          If absent, add them referencing §8.1.1 (SYSCFG_CFGR1)
          and §28. No new peripheral entry is needed — IRTIM is
          purely a logical function using existing peripherals.
        source-pages: [881]
        acceptance-criteria:
