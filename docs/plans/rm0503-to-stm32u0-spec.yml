          (0x000000XX per Table 87 page 413). The schema
          reset-value field is integer-only and cannot represent
          an unknown byte. Record 0x00 as a placeholder and add
          a note field to VREFBUF_CCR warning that bits [5:0]
          hold a factory value. Confirm the schema note field
          is sufficient or raise a schema-extension request.
        acceptance-criteria:
          - VREFBUF_CSR added with VRR, VRS, HIZ, ENVR fields.
          - VREFBUF_CCR added with TRIM[5:0] field.
          - VREFBUF_CSR reset value 0x00000002 matches Table 87.
          - VREFBUF_CCR reset value recorded as 0x00 with a note
            documenting the factory-trim caveat.
          - Offsets and access types match Table 87.
          - lint.sh passes.

