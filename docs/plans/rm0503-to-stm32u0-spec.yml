# ============================================================
# PHASE 0 – Schema extensions
# Must be completed before any downstream phase that uses them.
# ============================================================
phases:
  - id: P0
    title: Schema extensions
    description: >
      Extend docs/specs/schema-family.json to capture structure
      not yet expressible in the schema but required by ohal and
      future families.  Each step is atomic; implement and validate
      (jsonschema lint + existing spec lint) before moving to the
      next step.

    steps:
      - id: P0-S1
        title: "Schema: add reset-value to register definition"
        description: >
          Registers have a documented reset value. This is a formal
          specification datum required by ohal for initialisation
          and test generation, not merely context. Add an optional
          `reset-value` integer property to `$defs/register`.
        source-pages: []
        acceptance-criteria:
          - schema/register/$defs/register gains optional property
            reset-value (type integer, minimum 0).
          - docs/specs/stm32/stm32u0.yml continues to validate
            against the updated schema.
          - Any future family spec can also use reset-value.

      - id: P0-S2
        title: "Schema: add register-map array to peripheral"
        description: >
          RM0503 provides a register-map table for each peripheral
          (e.g. Table 19 for FLASH, Table 41 for GPIO). These maps
          list every register with its offset and reset value in a
          canonical order and serve as the authoritative source for
          verifying individual register definitions. Add an optional
          `register-map` array to `$defs/peripheral` whose items
          reference a register name and its reset value (and
          optionally the RM table number, for traceability).
        source-pages: []
        acceptance-criteria:
          - $defs/peripheral gains optional property register-map.
          - "Each register-map item has: name (string), offset
            (hex-address), reset-value (integer), and optionally
            source-table (string/number)."
          - Existing specs validate without change.

      - id: P0-S3
        title: "Schema: add source-table reference to register"
        description: >
          Individual registers may cite a specific table in the RM
          for their field layout.  Add optional `source-table`
          property (string or number) to `$defs/register` for
          traceability; it complements the existing `reference`
          object.
        source-pages: []
        acceptance-criteria:
          - $defs/register gains optional source-table (type
            string or number).
          - Existing specs validate without change.

      - id: P0-S4
        title: "Schema: add sub-family-filter to register"
        description: >
          Some registers differ per sub-family (e.g. bit fields
          present only on stm32u073/u083). Add optional
          `sub-families` array to `$defs/register` matching the
          pattern already used on peripheral-instance.
        source-pages: []
        acceptance-criteria:
          - $defs/register gains optional sub-families (array of
            string).
          - Existing specs validate without change.

      - id: P0-S5
        title: "Schema: add clock-source-constraints to peripheral"
        description: >
          Peripherals have clock source constraints documented in
          the RCC chapter (RM0503 §5). ohal needs this to emit
          correct clock-enable sequences. Add an optional
          `clock-sources` array to `$defs/peripheral`. Each item:
          name (string), bus (string, e.g. APB1/AHB), enable-bit
          (string). This must remain generic enough for non-STM32
          families.
        source-pages: []
        acceptance-criteria:
          - $defs/peripheral gains optional clock-sources array.
          - Validation passes on existing specs.

      - id: P0-S6
        title: "Schema: add dma-requests array to peripheral"
        description: >
          Table 49 (DMAMUX assignment) maps DMA request lines to
          peripherals. ohal requires this to generate DMA
          configuration. Add optional `dma-requests` array to
          `$defs/peripheral`. Each item: request-name (string),
          channel-id (integer or string), mux-input (integer).
        source-pages: [49]
        acceptance-criteria:
          - $defs/peripheral gains optional dma-requests array.
          - Validation passes on existing specs.

      - id: P0-S7
        title: "Schema: add alternate-functions array to peripheral-instance"
        description: >
          GPIO alternate function mappings (e.g. AF1=TIM1_CH1 on
          PA8) are per-instance data.  Table 16 (not in the
          extracted pages; see RM0503 datasheet, not this RM) and
          the GPIO AFRL/AFRH registers reference AF numbers.
          Add optional `alternate-functions` array to
          `$defs/peripheral-instance`. Each item: pin (string),
          af-number (integer 0-15), signal (string), sub-families
          (optional array). Note: the AF table is in the device
          datasheet, not RM0503; flag for developer guidance on
          source.
        source-pages: []
        concern: >
          AF pin mapping tables are in the device datasheet
          (DS13565 / DS13566 for STM32U0), not in RM0503.
          Confirm whether to source these from the datasheet
          extraction or leave for a separate plan.
        acceptance-criteria:
          - $defs/peripheral-instance gains optional
            alternate-functions array if developer confirms scope.
          - Developer guidance obtained before implementation.

      - id: P0-S8
        title: "Schema: add boot-modes table to family spec"
        description: >
          Table 6 (Boot modes) is a formal spec datum consumed by
          ohal for boot-sequence generation. Add a top-level
          optional `boot` object to the family schema with
          sub-fields: modes (array of boot-mode items each with
          name, boot-pin-state, source).
        source-pages: [51]
        acceptance-criteria:
          - Top-level `boot` property added to schema with
            appropriate definition.
          - Validation passes.

      - id: P0-S9
        title: "Schema: extend field access enum with RM0503 access types"
        description: >
          P1-S1 found that RM0503 §1.2 (page 51) defines 13 access types,
          replacing the schema's previous {rw, ro, wo} enum.  The full set
          of canonical RM0503 abbreviations is:
            rw     – read/write.
            r      – read-only (was ro).
            w      – write-only (was wo).
            rc_w1  – read; set by hardware; cleared by writing 1.
            rc_w0  – read; set by hardware; cleared by writing 0.
            rc_w   – read; cleared by any write.
            rc_r   – read; set by hardware; cleared by reading.
            rs_r   – read; set by reading.
            rs     – read; set by software (cleared by hardware).
            rwo    – read/write once after reset (was rw_once).
            t      – toggle by writing 1 (was rt_w).
            rt_w1  – read; writing 1 triggers an event (no effect on bit).
            res    – reserved; must not be modified by software.
          Existing fields in stm32u0.yml were migrated to the canonical
          abbreviations and all RESERVED fields were reclassified as res.
          The USART TDR implementation was corrected from WriteOnly to
          ReadWrite, and all timer SR fields were corrected from rw to rc_w0.
        filed-by: P1-S1
        acceptance-criteria:
          - "$defs/field/properties/access enum contains all 13 RM0503
            abbreviations (rw, r, w, rc_w0, rc_w1, rc_w, rc_r, rs_r,
            rs, rwo, t, rt_w1, res)."
          - Description string updated to explain all 13 values.
          - "docs/specs/stm32/stm32u0.yml validates against the updated
            schema with all access values using canonical abbreviations."
          - All STM32U0 C++ BitField access policies are consistent with
            the updated spec and RM0503 register tables.
          - lint.sh passes.

      - id: P0-S10
        title: "Schema: add flash-wait-states to peripheral"
        description: >
          P3-S16 requires structured wait-state table data under the flash
          peripheral. Add an optional `flash-wait-states` property to
          `$defs/peripheral` backed by new `$defs/flash-wait-states` and
          `$defs/flash-wait-state-entry` definitions. Each entry records a
          wait-state count (ws), the corresponding CPU-cycle count
          (cpu-cycles), and a map of voltage-range name to maximum HCLK
          frequency in MHz (max-hclk-mhz). The schema is designed to be
          generic enough for future families with different numbers or names
          of voltage ranges.
        filed-by: P3-S16
        acceptance-criteria:
          - "$defs/peripheral gains optional flash-wait-states property."
          - "$defs/flash-wait-states and $defs/flash-wait-state-entry added."
          - docs/specs/stm32/stm32u0.yml validates against the updated schema.
          - lint.sh passes.

  # ============================================================
  # PHASE 1 – Documentation conventions (§1, pages 51-52)
  # ============================================================

  - id: P1
    title: "Documentation conventions (§1)"
    description: >
      Extract register abbreviations and feature-availability
      conventions used throughout RM0503. These inform how
      spec data is interpreted rather than directly adding
      peripheral registers.

    steps:
      - id: P1-S1
        title: "Verify register-access abbreviation set (§1.2)"
        description: >
          RM0503 §1.2 defines register-access abbreviations
          (r, w, rw, rs, rc_w1, rc_w0, rc_r, rw_once, rt_w, etc.).
          Cross-check that the schema's `access` enum {rw, ro, wo}
          covers all abbreviations used in RM0503 for registers
          that ohal targets. Document any gap as a schema extension
          concern.
        source-pages: [51]
        acceptance-criteria:
          - Each RM0503 access type used in ohal-relevant registers
            is either already covered by the schema enum or a
            schema extension task is filed.
          - No spec changes unless a gap is found.

      - id: P1-S2
        title: "Record peripheral-availability table reference (§1.5 / Table 1)"
        description: >
          Table 1 (Peripherals versus products) is the authoritative
          source for per-sub-family feature availability. Verify
          that all rows in Table 1 relevant to ohal are already
          reflected in the `features.data` section of
          stm32u0.yml. File individual correction tasks for any
          missing or mismatched row.
        source-pages: [51, 52]
        acceptance-criteria:
          - Table 1 reviewed against stm32u0.yml `features.data`.
          - Discrepancies each have a separate filed step; none
            are silently resolved here.

  # ============================================================
  # PHASE 2 – Memory and bus architecture (§2)
  # Pages approximately 53-63
  # ============================================================

  - id: P2
    title: "Memory and bus architecture (§2)"

    steps:
      - id: P2-S1
        title: "Verify memory map against §2.2.2 / Tables 2, 3, 4"
        description: >
          Tables 2 and 3 give memory boundary addresses for
          STM32U073/83 and STM32U031 respectively. Table 4 gives
          peripheral register boundary addresses. Cross-check
          each entry against `memory.map` in stm32u0.yml and
          `peripherals[*].instances[*].base`.
        source-pages: [56, 57, 58, 59, 60]
        acceptance-criteria:
          - Every Table 2/3/4 entry checked against the spec.
          - Mismatches each produce a separate atomic correction
            step; none are resolved silently here.
        note: >
          Verification outcome: all Table 2, 3, and 4 entries match
          stm32u0.yml memory.map and peripherals[*].instances[*].base,
          with one internal inconsistency in RM0503 noted below.
          Table 2 gives the STM32U073/STM32U083 SRAM end boundary as
          0x20029FFF (this is the value in the original RM0503 PDF, not
          an OCR artefact), but the same row states the size as
          40 Kbytes. 40 Kbytes = 0xA000 bytes, so start 0x20000000 +
          0xA000 - 1 = 0x20009FFF. The spec uses 0x20009FFF, which is
          consistent with the stated size; the boundary address in the
          PDF appears to be a typographic error. Table 4 continues on
          page 60 (not listed in the original source-pages); updated here.

      - id: P2-S2
        title: "Correct memory map entry: Table 2/3/4 mismatch resolutions"
        description: >
          Placeholder step. For each mismatch found in P2-S1,
          create a child step (P2-S2a, P2-S2b, …) that corrects
          exactly one address entry in stm32u0.yml.
        depends-on: [P2-S1]
        acceptance-criteria:
          - Each correction step changes at most one memory-map
            entry.
          - lint.sh passes after each child step.
        note: >
          No mismatches found in P2-S1; no child steps required.
          Step vacuously satisfied.

      - id: P2-S3
        title: "Add SRAM size data (§2.3 / Table 5)"
        description: >
          Table 5 gives SRAM sizes per sub-family. Verify the
          SRAM entries in `memory.map` match Table 5 exactly.
        source-pages: [60]
        acceptance-criteria:
          - SRAM start/end addresses and derived sizes match
            Table 5 for all three sub-families.
          - Note the SRAM verified flag is set to true if
            previously false.

      - id: P2-S4
        title: "Add boot-modes table (§2.5 / Table 6)"
        description: >
          Table 6 specifies boot modes (BOOT0 pin + FLASH option
          byte combinations). Using the schema extension from
          P0-S8, add a `boot.modes` section to stm32u0.yml.
        source-pages: [62]
        depends-on: [P0-S8]
        acceptance-criteria:
          - stm32u0.yml boot.modes section added with all rows
            from Table 6.
          - spec validates against schema.
          - lint.sh passes.

  # ============================================================
  # PHASE 3 – FLASH peripheral (§3)
  # Pages approximately 64-103
  # ============================================================

  - id: P3
    title: "Embedded FLASH peripheral (§3)"
    description: >
      FLASH registers are needed by ohal for read-wait-state
      configuration and option-byte management.

    steps:
      - id: P3-S1
        title: "Add FLASH peripheral skeleton to stm32u0.yml"
        description: >
          Add a `flash` peripheral entry with the base address
          0x40022000 and empty registers list. Instances:
          single instance FLASH at 0x40022000 for all sub-families.
        source-pages: [64]
        acceptance-criteria:
          - stm32u0.yml has a `flash` peripheral with correct base.
          - spec validates.

      - id: P3-S2
        title: "Add FLASH_ACR register (§3.7.1)"
        description: >
          Add FLASH_ACR (offset 0x00) with all fields from §3.7.1
          and correct reset values.
        source-pages: [86, 87]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_ACR has correct offset, reset-value, and all
            fields with correct msb/lsb/width/access/settings.
          - lint.sh passes.

      - id: P3-S3
        title: "Add FLASH_KEYR register (§3.7.2)"
        source-pages: [87]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_KEYR at offset 0x08 with correct fields.
          - lint.sh passes.

      - id: P3-S4
        title: "Add FLASH_OPTKEYR register (§3.7.3)"
        source-pages: [87]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_OPTKEYR at offset 0x0C with correct fields.
          - lint.sh passes.

      - id: P3-S5
        title: "Add FLASH_SR register (§3.7.4)"
        source-pages: [88, 89]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_SR at offset 0x10 with all fields.
          - lint.sh passes.

      - id: P3-S6
        title: "Add FLASH_CR register (§3.7.5)"
        source-pages: [90, 91, 92]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_CR at offset 0x14 with all fields.
          - lint.sh passes.

      - id: P3-S7
        title: "Add FLASH_ECCR register (§3.7.6)"
        source-pages: [92, 93]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_ECCR at offset 0x18 with all fields.
          - lint.sh passes.

      - id: P3-S8
        title: "Add FLASH_OPTR register (§3.7.7)"
        source-pages: [93, 94, 95]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_OPTR at offset 0x20 with all sub-family-varying
            fields correctly marked.
          - lint.sh passes.

      - id: P3-S9
        title: "Add FLASH_WRP1AR register (§3.7.8)"
        source-pages: [95]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_WRP1AR at offset 0x28 with correct fields.
          - lint.sh passes.

      - id: P3-S10
        title: "Add FLASH_WRP1BR register (§3.7.9)"
        source-pages: [95, 96]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_WRP1BR at offset 0x2C with correct fields.
          - lint.sh passes.

      - id: P3-S11
        title: "Add FLASH_SECR register (§3.7.10)"
        source-pages: [96, 97]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_SECR at offset 0x80 (verify exact offset from
            register map Table 19 before committing).
          - lint.sh passes.

      - id: P3-S12
        title: "Add FLASH OEM key registers (§3.7.11–§3.7.19)"
        description: >
          Nine OEM key registers. Add all in a single step as
          they are structurally repetitive write-only key slots.
          Read Table 19 carefully for exact offsets.
        source-pages: [97, 98, 99, 100]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - All nine registers added with correct offsets and
            write-only access.
          - lint.sh passes.

      - id: P3-S13
        title: "Add FLASH_HDPCR and FLASH_HDPEXTR registers (§3.7.20–§3.7.21)"
        source-pages: [100, 101]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - Both registers added with correct fields.
          - lint.sh passes.

      - id: P3-S14
        title: "Add FLASH register-map from Table 19"
        description: >
          Using P0-S2 schema extension, add a register-map array
          to the flash peripheral entry citing Table 19. Cross-
          check every previously added register offset/reset-value
          against Table 19.
        source-pages: [102, 103]
        depends-on: [P3-S2, P3-S3, P3-S4, P3-S5, P3-S6, P3-S7, P3-S8, P3-S9, P3-S10, P3-S11, P3-S12, P3-S13, P0-S2]
        acceptance-criteria:
          - FLASH register-map section matches Table 19 completely.
          - Any offset/reset-value discrepancy produces a separate
            correction step; none resolved silently.
          - lint.sh passes.

      - id: P3-S14a
        title: "Correct FLASH_ACR reset-value (Table 19 discrepancy)"
        description: >
          P3-S14 cross-check found that the FLASH_ACR individual
          register entry has reset-value 0x00040600, but Table 19
          gives 0x00040200 (DBG_SWEN=bit 18, ICEN=bit 9 only).
          Bit 10 (RESERVED) is erroneously set in the stored value.
          Correct the ACR reset-value to 0x00040200.
        source-pages: [102]
        depends-on: [P3-S14]
        acceptance-criteria:
          - FLASH ACR register reset-value is 0x00040200.
          - register-map entry and individual register are consistent.
          - lint.sh passes.

      - id: P3-S14b
        title: "Correct OEM key register reset-values (Table 19 discrepancy)"
        description: >
          P3-S14 cross-check found that OEM1KEYR1-4 and OEM2KEYR1-4
          individual register entries have reset-value 0xFFFFFFFF, but
          the RM states these registers are write-only and always read
          as zero. Table 19 marks all bits as X (factory-programmed
          key), which must be represented as 0x00000000 — the actual
          read-back value — not 0xFFFFFFFF. The register-map (P3-S14)
          already records 0x00000000. Correct the eight individual
          register entries to match.
        source-pages: [102, 103]
        depends-on: [P3-S14]
        acceptance-criteria:
          - OEM1KEYR1, OEM1KEYR2, OEM1KEYR3, OEM1KEYR4 have
            reset-value 0x00000000.
          - OEM2KEYR1, OEM2KEYR2, OEM2KEYR3, OEM2KEYR4 have
            reset-value 0x00000000.
          - register-map entries and individual registers are
            consistent.
          - lint.sh passes.

      - id: P3-S15
        title: "Add FLASH interrupt-events (§3.6 / Table 18)"
        source-pages: [85, 86]
        depends-on: [P3-S1]
        acceptance-criteria:
          - FLASH peripheral has interrupt-events section with all
            rows from Table 18.
          - lint.sh passes.

      - id: P3-S16
        title: "Add FLASH wait-state table reference (§3.3.3 / Table 9)"
