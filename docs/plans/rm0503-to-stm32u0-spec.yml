# yaml-language-server: $schema=schema-plan.json
# Incremental plan: incorporate RM0503 content into docs/specs/stm32/stm32u0.yml
#
# Source: C:\src\ohal\claude\rm0503\  (1333 extracted markdown pages)
# Target: docs/specs/stm32/stm32u0.yml
# Schema: docs/specs/schema-family.json
#
# Principles
# ----------
# - Each step is atomic (single concern, single PR-level commit).
# - Notes in the YAML spec are reserved for structured context only;
#   formal specification data must use typed schema fields.
# - No assumptions are made about figure content (figures are absent
#   from the extracted markdown; only captions are present).
# - Table concerns that cannot be resolved unambiguously are flagged
#   with page/section/table references, possible interpretations, and
#   confidence levels, and are escalated to the developer.
# - Schema extensions are tracked here and must be implemented before
#   the step that first requires them.
# - The plan is family-agnostic in intent; schema extensions must
#   remain valid for future families (e.g. msp430fr2xx4xx).

meta:
  plan-version: "1.1.0"
  rm-source: RM0503
  rm-revision: 4
  rm-last-modified: "2025-07"
  target-spec: docs/specs/stm32/stm32u0.yml
  schema: docs/specs/schema-family.json
  page-corpus: claude/rm0503/
  total-pages: 1333

  # ------------------------------------------------------------------
  # Step-completion policy
  # Applies to every step in every phase.  The final acceptance
  # criterion for ANY step is always:
  #   "progress.current is updated to the id of the next step
  #    (or to the first step of the next phase if this is the last
  #    step in the current phase, or to 'complete' if this is the
  #    very last step in the plan)."
  # This policy is recorded once here rather than duplicated on every
  # step.  Tooling and reviewers MUST treat it as an implicit trailing
  # item in every step's acceptance-criteria list.
  # ------------------------------------------------------------------
  step-completion-policy: >
    When a step's acceptance criteria are fully met, update
    progress.current to the id of the next step before closing the
    work item.  If the step is the last step in its phase, advance to
    the first step of the following phase.  If no further steps exist,
    set progress.current to "complete".  Record the completed step in
    progress.history with its id and the ISO-8601 date of acceptance.

  # ------------------------------------------------------------------
  # Progress tracker
  # current  – the step that should be worked on RIGHT NOW.
  # history  – ordered list of accepted steps (oldest first).
  # ------------------------------------------------------------------
  progress:
    current: P0-S1
    history: []

# ============================================================
# PHASE 0 – Schema extensions
# Must be completed before any downstream phase that uses them.
# ============================================================
phases:

  - id: P0
    title: Schema extensions
    description: >
      Extend docs/specs/schema-family.json to capture structure
      not yet expressible in the schema but required by ohal and
      future families.  Each step is atomic; implement and validate
      (jsonschema lint + existing spec lint) before moving to the
      next step.

    steps:

      - id: P0-S1
        title: "Schema: add reset-value to register definition"
        description: >
          Registers have a documented reset value. This is a formal
          specification datum required by ohal for initialisation
          and test generation, not merely context. Add an optional
          `reset-value` integer property to `$defs/register`.
        source-pages: []
        acceptance-criteria:
          - schema/register/$defs/register gains optional property
            reset-value (type integer, minimum 0).
          - docs/specs/stm32/stm32u0.yml continues to validate
            against the updated schema.
          - Any future family spec can also use reset-value.

      - id: P0-S2
        title: "Schema: add register-map array to peripheral"
        description: >
          RM0503 provides a register-map table for each peripheral
          (e.g. Table 19 for FLASH, Table 41 for GPIO). These maps
          list every register with its offset and reset value in a
          canonical order and serve as the authoritative source for
          verifying individual register definitions. Add an optional
          `register-map` array to `$defs/peripheral` whose items
          reference a register name and its reset value (and
          optionally the RM table number, for traceability).
        source-pages: []
        acceptance-criteria:
          - $defs/peripheral gains optional property register-map.
          - "Each register-map item has: name (string), offset
            (hex-address), reset-value (integer), and optionally
            source-table (string/number)."
          - Existing specs validate without change.

      - id: P0-S3
        title: "Schema: add source-table reference to register"
        description: >
          Individual registers may cite a specific table in the RM
          for their field layout.  Add optional `source-table`
          property (string or number) to `$defs/register` for
          traceability; it complements the existing `reference`
          object.
        source-pages: []
        acceptance-criteria:
          - $defs/register gains optional source-table (type
            string or number).
          - Existing specs validate without change.

      - id: P0-S4
        title: "Schema: add sub-family-filter to register"
        description: >
          Some registers differ per sub-family (e.g. bit fields
          present only on stm32u073/u083). Add optional
          `sub-families` array to `$defs/register` matching the
          pattern already used on peripheral-instance.
        source-pages: []
        acceptance-criteria:
          - $defs/register gains optional sub-families (array of
            string).
          - Existing specs validate without change.

      - id: P0-S5
        title: "Schema: add clock-source-constraints to peripheral"
        description: >
          Peripherals have clock source constraints documented in
          the RCC chapter (RM0503 §5). ohal needs this to emit
          correct clock-enable sequences. Add an optional
          `clock-sources` array to `$defs/peripheral`. Each item:
          name (string), bus (string, e.g. APB1/AHB), enable-bit
          (string). This must remain generic enough for non-STM32
          families.
        source-pages: []
        acceptance-criteria:
          - $defs/peripheral gains optional clock-sources array.
          - Validation passes on existing specs.

      - id: P0-S6
        title: "Schema: add dma-requests array to peripheral"
        description: >
          Table 49 (DMAMUX assignment) maps DMA request lines to
          peripherals. ohal requires this to generate DMA
          configuration. Add optional `dma-requests` array to
          `$defs/peripheral`. Each item: request-name (string),
          channel-id (integer or string), mux-input (integer).
        source-pages: [49]
        acceptance-criteria:
          - $defs/peripheral gains optional dma-requests array.
          - Validation passes on existing specs.

      - id: P0-S7
        title: "Schema: add alternate-functions array to peripheral-instance"
        description: >
          GPIO alternate function mappings (e.g. AF1=TIM1_CH1 on
          PA8) are per-instance data.  Table 16 (not in the
          extracted pages; see RM0503 datasheet, not this RM) and
          the GPIO AFRL/AFRH registers reference AF numbers.
          Add optional `alternate-functions` array to
          `$defs/peripheral-instance`. Each item: pin (string),
          af-number (integer 0-15), signal (string), sub-families
          (optional array). Note: the AF table is in the device
          datasheet, not RM0503; flag for developer guidance on
          source.
        source-pages: []
        concern: >
          AF pin mapping tables are in the device datasheet
          (DS13565 / DS13566 for STM32U0), not in RM0503.
          Confirm whether to source these from the datasheet
          extraction or leave for a separate plan.
        acceptance-criteria:
          - $defs/peripheral-instance gains optional
            alternate-functions array if developer confirms scope.
          - Developer guidance obtained before implementation.

      - id: P0-S8
        title: "Schema: add boot-modes table to family spec"
        description: >
          Table 6 (Boot modes) is a formal spec datum consumed by
          ohal for boot-sequence generation. Add a top-level
          optional `boot` object to the family schema with
          sub-fields: modes (array of boot-mode items each with
          name, boot-pin-state, source).
        source-pages: [51]
        acceptance-criteria:
          - Top-level `boot` property added to schema with
            appropriate definition.
          - Validation passes.

  # ============================================================
  # PHASE 1 – Documentation conventions (§1, pages 51-52)
  # ============================================================

  - id: P1
    title: "Documentation conventions (§1)"
    description: >
      Extract register abbreviations and feature-availability
      conventions used throughout RM0503. These inform how
      spec data is interpreted rather than directly adding
      peripheral registers.

    steps:

      - id: P1-S1
        title: "Verify register-access abbreviation set (§1.2)"
        description: >
          RM0503 §1.2 defines register-access abbreviations
          (r, w, rw, rs, rc_w1, rc_w0, rc_r, rw_once, rt_w, etc.).
          Cross-check that the schema's `access` enum {rw, ro, wo}
          covers all abbreviations used in RM0503 for registers
          that ohal targets. Document any gap as a schema extension
          concern.
        source-pages: [51]
        acceptance-criteria:
          - Each RM0503 access type used in ohal-relevant registers
            is either already covered by the schema enum or a
            schema extension task is filed.
          - No spec changes unless a gap is found.

      - id: P1-S2
        title: "Record peripheral-availability table reference (§1.5 / Table 1)"
        description: >
          Table 1 (Peripherals versus products) is the authoritative
          source for per-sub-family feature availability. Verify
          that all rows in Table 1 relevant to ohal are already
          reflected in the `features.data` section of
          stm32u0.yml. File individual correction tasks for any
          missing or mismatched row.
        source-pages: [51, 52]
        acceptance-criteria:
          - Table 1 reviewed against stm32u0.yml `features.data`.
          - Discrepancies each have a separate filed step; none
            are silently resolved here.

  # ============================================================
  # PHASE 2 – Memory and bus architecture (§2)
  # Pages approximately 53-63
  # ============================================================

  - id: P2
    title: "Memory and bus architecture (§2)"

    steps:

      - id: P2-S1
        title: "Verify memory map against §2.2.2 / Tables 2, 3, 4"
        description: >
          Tables 2 and 3 give memory boundary addresses for
          STM32U073/83 and STM32U031 respectively. Table 4 gives
          peripheral register boundary addresses. Cross-check
          each entry against `memory.map` in stm32u0.yml and
          `peripherals[*].instances[*].base`.
        source-pages: [56, 57, 58, 59]
        acceptance-criteria:
          - Every Table 2/3/4 entry checked against the spec.
          - Mismatches each produce a separate atomic correction
            step; none are resolved silently here.

      - id: P2-S2
        title: "Correct memory map entry: Table 2/3/4 mismatch resolutions"
        description: >
          Placeholder step. For each mismatch found in P2-S1,
          create a child step (P2-S2a, P2-S2b, …) that corrects
          exactly one address entry in stm32u0.yml.
        depends-on: [P2-S1]
        acceptance-criteria:
          - Each correction step changes at most one memory-map
            entry.
          - lint.sh passes after each child step.

      - id: P2-S3
        title: "Add SRAM size data (§2.3 / Table 5)"
        description: >
          Table 5 gives SRAM sizes per sub-family. Verify the
          SRAM entries in `memory.map` match Table 5 exactly.
        source-pages: [60]
        acceptance-criteria:
          - SRAM start/end addresses and derived sizes match
            Table 5 for all three sub-families.
          - Note the SRAM verified flag is set to true if
            previously false.

      - id: P2-S4
        title: "Add boot-modes table (§2.5 / Table 6)"
        description: >
          Table 6 specifies boot modes (BOOT0 pin + FLASH option
          byte combinations). Using the schema extension from
          P0-S8, add a `boot.modes` section to stm32u0.yml.
        source-pages: [62]
        depends-on: [P0-S8]
        acceptance-criteria:
          - stm32u0.yml boot.modes section added with all rows
            from Table 6.
          - spec validates against schema.
          - lint.sh passes.

  # ============================================================
  # PHASE 3 – FLASH peripheral (§3)
  # Pages approximately 64-103
  # ============================================================

  - id: P3
    title: "Embedded FLASH peripheral (§3)"
    description: >
      FLASH registers are needed by ohal for read-wait-state
      configuration and option-byte management.

    steps:

      - id: P3-S1
        title: "Add FLASH peripheral skeleton to stm32u0.yml"
        description: >
          Add a `flash` peripheral entry with the base address
          0x40022000 and empty registers list. Instances:
          single instance FLASH at 0x40022000 for all sub-families.
        source-pages: [64]
        acceptance-criteria:
          - stm32u0.yml has a `flash` peripheral with correct base.
          - spec validates.

      - id: P3-S2
        title: "Add FLASH_ACR register (§3.7.1)"
        description: >
          Add FLASH_ACR (offset 0x00) with all fields from §3.7.1
          and correct reset values.
        source-pages: [86, 87]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_ACR has correct offset, reset-value, and all
            fields with correct msb/lsb/width/access/settings.
          - lint.sh passes.

      - id: P3-S3
        title: "Add FLASH_KEYR register (§3.7.2)"
        source-pages: [87]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_KEYR at offset 0x08 with correct fields.
          - lint.sh passes.

      - id: P3-S4
        title: "Add FLASH_OPTKEYR register (§3.7.3)"
        source-pages: [87]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_OPTKEYR at offset 0x0C with correct fields.
          - lint.sh passes.

      - id: P3-S5
        title: "Add FLASH_SR register (§3.7.4)"
        source-pages: [88, 89]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_SR at offset 0x10 with all fields.
          - lint.sh passes.

      - id: P3-S6
        title: "Add FLASH_CR register (§3.7.5)"
        source-pages: [90, 91, 92]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_CR at offset 0x14 with all fields.
          - lint.sh passes.

      - id: P3-S7
        title: "Add FLASH_ECCR register (§3.7.6)"
        source-pages: [92, 93]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_ECCR at offset 0x18 with all fields.
          - lint.sh passes.

      - id: P3-S8
        title: "Add FLASH_OPTR register (§3.7.7)"
        source-pages: [93, 94, 95]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_OPTR at offset 0x20 with all sub-family-varying
            fields correctly marked.
          - lint.sh passes.

      - id: P3-S9
        title: "Add FLASH_WRP1AR register (§3.7.8)"
        source-pages: [95]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_WRP1AR at offset 0x28 with correct fields.
          - lint.sh passes.

      - id: P3-S10
        title: "Add FLASH_WRP1BR register (§3.7.9)"
        source-pages: [95, 96]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_WRP1BR at offset 0x2C with correct fields.
          - lint.sh passes.

      - id: P3-S11
        title: "Add FLASH_SECR register (§3.7.10)"
        source-pages: [96, 97]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - FLASH_SECR at offset 0x80 (verify exact offset from
            register map Table 19 before committing).
          - lint.sh passes.

      - id: P3-S12
        title: "Add FLASH OEM key registers (§3.7.11–§3.7.19)"
        description: >
          Nine OEM key registers. Add all in a single step as
          they are structurally repetitive write-only key slots.
          Read Table 19 carefully for exact offsets.
        source-pages: [97, 98, 99, 100]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - All nine registers added with correct offsets and
            write-only access.
          - lint.sh passes.

      - id: P3-S13
        title: "Add FLASH_HDPCR and FLASH_HDPEXTR registers (§3.7.20–§3.7.21)"
        source-pages: [100, 101]
        depends-on: [P3-S1, P0-S1]
        acceptance-criteria:
          - Both registers added with correct fields.
          - lint.sh passes.

      - id: P3-S14
        title: "Add FLASH register-map from Table 19"
        description: >
          Using P0-S2 schema extension, add a register-map array
          to the flash peripheral entry citing Table 19. Cross-
          check every previously added register offset/reset-value
          against Table 19.
        source-pages: [102, 103]
        depends-on: [P3-S2, P3-S3, P3-S4, P3-S5, P3-S6, P3-S7,
                     P3-S8, P3-S9, P3-S10, P3-S11, P3-S12,
                     P3-S13, P0-S2]
        acceptance-criteria:
          - FLASH register-map section matches Table 19 completely.
          - Any offset/reset-value discrepancy produces a separate
            correction step; none resolved silently.
          - lint.sh passes.

      - id: P3-S15
        title: "Add FLASH interrupt-events (§3.6 / Table 18)"
        source-pages: [85, 86]
        depends-on: [P3-S1]
        acceptance-criteria:
          - FLASH peripheral has interrupt-events section with all
            rows from Table 18.
          - lint.sh passes.

      - id: P3-S16
        title: "Add FLASH wait-state table reference (§3.3.3 / Table 9)"
        description: >
          Table 9 defines wait states vs. HCLK frequency. This
          is used by ohal clock-init code. Add a
          `flash-wait-states` structured section to stm32u0.yml
          under the flash peripheral or as a top-level entry.
          File a schema-extension task (P0 child) if the schema
          does not yet have a home for this.
        source-pages: [67, 68]
        depends-on: [P3-S1]
        concern: >
          Table 9 structure: it maps HCLK frequency ranges to
          number of wait states, and may also include voltage-
          range columns. The exact column structure must be
          verified from the extracted pages before the schema
          extension is designed. Do not assume column layout.
        acceptance-criteria:
          - Developer confirms table structure.
          - Schema extension filed if needed.
          - Wait-state data added once schema is confirmed.

  # ============================================================
  # PHASE 4 – Power control (PWR) (§4)
  # Pages approximately 104-148
  # ============================================================

  - id: P4
    title: "Power control (PWR) (§4)"

    steps:

      - id: P4-S1
        title: "Add PWR peripheral skeleton"
        description: >
          Base address 0x40007000. Present on all sub-families.
        source-pages: [104]
        acceptance-criteria:
          - PWR peripheral entry added with correct base.
          - spec validates.

      - id: P4-S2
        title: "Add low-power mode summary table (§4.3 / Table 21)"
        description: >
          Table 21 is a cross-cutting formal specification datum
          for ohal low-power mode support. Add a top-level
          `low-power-modes` section to stm32u0.yml (schema
          extension P0 child required; file before implementing).
        source-pages: [115, 116]
        concern: >
          Table 21 may span multiple pages (pages ~115-116).
          Check whether the table is split and that no rows are
          missed.  Table 22 may extend it; treat both as separate
          atomic steps.
        acceptance-criteria:
          - Developer guidance on schema location for low-power
            mode summary obtained before implementation.

      - id: P4-S3
        title: "Add PWR registers from §4.7 (all)"
        description: >
          Add all PWR registers. Read each register section
          atomically; if a register's description page is also
          the last page of the previous register, verify the
          boundary carefully. Use Table 31 (register map) to
          verify offsets and reset values.
        source-pages: [133, 134, 135, 136, 137, 138, 139, 140,
                       141, 142, 143, 144, 145, 146, 147, 148]
        depends-on: [P4-S1, P0-S1]
        note: >
          PWR registers are split into individual atomic sub-steps
          below (P4-S3a … P4-S3n) based on the register map
          Table 31. Each sub-step adds exactly one register.
        acceptance-criteria:
          - All PWR registers present with correct fields.
          - Register-map from Table 31 added via P0-S2 extension.
          - lint.sh passes.

      # Individual PWR register sub-steps are enumerated after
      # Table 31 (page ~148) has been reviewed. They are listed
      # here as a placeholder pending that review.
      - id: P4-S3a
        title: "Enumerate PWR register sub-steps from Table 31"
        description: >
          Read Table 31 (page ~148) and create one sub-step per
          register row. This step produces child steps
          P4-S3b, P4-S3c, … but makes no spec changes itself.
        source-pages: [148]
        acceptance-criteria:
          - Child steps enumerated covering every PWR register.

  # ============================================================
  # PHASE 5 – Reset and clock control (RCC) (§5)
  # Pages approximately 149-213
  # ============================================================

  - id: P5
    title: "Reset and clock control (RCC) (§5)"

    steps:

      - id: P5-S1
        title: "Add RCC peripheral skeleton"
        description: >
          Base 0x40021000. All sub-families.
        source-pages: [149]
        acceptance-criteria:
          - RCC peripheral entry added.
          - spec validates.

      - id: P5-S2
        title: "Add clock-source frequency table (§5.4 / Table 32)"
        description: >
          Table 32 lists oscillator frequencies. This is a formal
          specification datum required by ohal for clock
          initialisation. File a schema extension if needed to
          host a `clock-sources` top-level or RCC-peripheral
          structured section.
        source-pages: [162]
        concern: >
          Table 32 may list HSI16, MSI, HSE, LSE, LSI, HSI48
          with their nominal frequencies and tolerances. The
          column layout must be read from the extracted page
          before the schema is extended. Do not assume column
          layout.
        acceptance-criteria:
          - Table 32 structure confirmed from extracted page.
          - Schema extension filed and implemented.
          - Clock-source data added.

      - id: P5-S3
        title: "Add RCC registers from §5.7 (all) – enumeration step"
        description: >
          Read Table 33 (register map, page ~210) and enumerate
          individual register sub-steps. Makes no spec changes.
        source-pages: [210, 211, 212, 213]
        acceptance-criteria:
          - Child steps enumerated covering every RCC register.

      - id: P5-S4
        title: "Add RCC registers (child steps)"
        description: >
          Placeholder. Each child step P5-S4a … P5-S4n adds one
          RCC register. Child steps depend on P5-S1 and P0-S1.
        depends-on: [P5-S1, P0-S1, P5-S3]
        acceptance-criteria:
          - All RCC registers present with correct fields.
          - Register-map from Table 33 added.
          - lint.sh passes after each child step.

      - id: P5-S5
        title: "Add peripheral clock-enable bits to peripheral entries"
        description: >
          For each peripheral already in stm32u0.yml, add the
          clock-source entry (P0-S5 schema extension) using the
          RCC enable-bit name from the RCC register fields.
        depends-on: [P0-S5, P5-S4]
        acceptance-criteria:
          - Every peripheral in stm32u0.yml has a clock-sources
            entry referencing the correct RCC bit.
          - lint.sh passes.

  # ============================================================
  # PHASE 6 – CRS (§6)
  # Pages approximately 214-224
  # ============================================================

  - id: P6
    title: "Clock recovery system (CRS) (§6)"
    description: >
      CRS is present only on stm32u073 and stm32u083.

    steps:

      - id: P6-S1
        title: "Add CRS peripheral skeleton"
        description: >
          Base 0x40006C00. Sub-families: [stm32u073, stm32u083].
        source-pages: [214]
        acceptance-criteria:
          - CRS peripheral entry added with sub-families filter.
          - spec validates.

      - id: P6-S2
        title: "Add CRS registers (enumeration from Table 39)"
        source-pages: [224]
        depends-on: [P6-S1]
        acceptance-criteria:
          - Child steps enumerated for every CRS register.

      - id: P6-S3
        title: "Add CRS registers (child steps)"
        depends-on: [P6-S2, P0-S1]
        acceptance-criteria:
          - All CRS registers added with correct fields.
          - lint.sh passes.

      - id: P6-S4
        title: "Add CRS interrupt-events (§6.5 / Table 38)"
        source-pages: [219]
        depends-on: [P6-S1]
        acceptance-criteria:
          - CRS interrupt-events section complete.
          - lint.sh passes.

  # ============================================================
  # PHASE 7 – GPIO supplemental data (§7)
  # Pages approximately 225-261
  # ============================================================

  - id: P7
    title: "GPIO supplemental data (§7)"
    description: >
      GPIO peripheral registers are already in stm32u0.yml.
      This phase adds missing structured data: reset values,
      register-map verification, and port-bit configuration.

    steps:

      - id: P7-S1
        title: "Add reset values to all GPIO registers (§7.4 / Table 41)"
        description: >
          Use Table 41 (GPIO register map and reset values) to
          add reset-value to every GPIO register using the
          P0-S1 schema extension.
        source-pages: [241, 242, 243, 244]
        depends-on: [P0-S1, P0-S2]
