open-concerns:

  - id: OC-1
    step: P0-S7
    description: >
      Alternate function (AF) pin-to-signal mapping tables are
      in the device datasheet (DS13565/DS13566 for STM32U0),
      not in RM0503. Confirm whether AF mapping should be sourced
      from a separate datasheet extraction plan or deferred.

  - id: OC-2
    step: P3-S16
    description: >
      FLASH wait-state table (Table 9) column structure: it may
      include voltage-range columns in addition to HCLK frequency
      ranges. Confirm column layout from page ~67 of the
      extracted pages before designing the schema extension.

  - id: OC-3
    step: P4-S2
    description: >
      Low-power mode summary tables (Tables 21-30) are spread
      across multiple pages (~115-131). The schema currently has
      no structured home for a cross-peripheral low-power mode
      table. Confirm the intended schema location before
      implementing.

  - id: OC-4
    step: P7-S1
    description: >
      GPIO register reset values in Table 41 may differ by
      sub-family (e.g. MODER reset value differs between ports
      due to debug pin reservations). If so, the schema needs
      a reset-value-by-sub-family capability. Confirm from the
      extracted table before implementing.

  - id: OC-5
    step: P9-S6
    description: >
      DMAMUX Table 49 maps request numbers to peripheral signals.
      If any row is ambiguous or spans a page break in the
      extracted markdown, it must not be assumed; escalate.

  - id: OC-6
    step: P28-S1
    description: >
      USART register reset values in Table 209 may differ between
      full-feature-set (USART1/2) and basic-feature-set (USART3/4)
      instances, because some registers (GTPR, RTOR) do not
      exist in the basic tier. Confirm whether the schema needs
      a per-instance register-exclusion mechanism.

  - id: OC-7
    step: P31-S1
    description: >
      USB peripheral address map: the memory map has separate
      entries for USB (0x40005C00) and USB RAM1 (0x40009800).
      Clarify whether these should be one peripheral with two
      regions or two separate peripheral entries in the spec.

  - id: OC-8
    step: P35-S4
    description: >
      DBGMCU Table 258 (peripheral clock freeze) may have a
      complex column structure. Confirm before designing the
      schema extension.

  - id: OC-9
    step: P36-S1
    description: >
      Device-signature register addresses (UID, flash size,
      package) are in the MCU information block; their exact
      addresses must be read from §39 of the extracted pages
      before implementing. Do not use assumed addresses.

  - id: OC-10
    status: resolved
