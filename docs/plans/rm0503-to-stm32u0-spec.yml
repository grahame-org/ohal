      STM32U083xx devices only.
      Two registers: VREFBUF_CSR (offset 0x00) and VREFBUF_CCR
      (offset 0x04). Register map is Table 87 (page 413).

    steps:
      - id: P39-S1
        title: "Add VREFBUF peripheral skeleton"
        description: >
          Base 0x40010030. Sub-families: [stm32u073, stm32u083].
        source-pages: [411]
        acceptance-criteria:
          - VREFBUF peripheral entry added with correct sub-family filter.
          - spec validates.

      - id: P39-S2
        title: "Add VREFBUF registers (VREFBUF_CSR and VREFBUF_CCR)"
        description: >
          Add VREFBUF_CSR (offset 0x00, reset 0x00000002) and
          VREFBUF_CCR (offset 0x04). VREFBUF_CCR reset value is
          factory-trimmed (documented as 0x000000XX in RM0503
          Table 87) and cannot be expressed as a concrete integer.
          Record reset value as 0x00 in the spec and add a note
          that bits [5:0] (TRIM) hold a factory-programmed value
          that must not be overwritten without calibration.
          Register fields: VRR (r), VRS (rw), HIZ (rw), ENVR (rw)
          in CSR; TRIM[5:0] (rw) in CCR.
        source-pages: [412, 413]
        depends-on: [P39-S1, P0-S1]
        concern: >
